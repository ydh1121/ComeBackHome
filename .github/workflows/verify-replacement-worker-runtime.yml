name: Verify Replacement Worker Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/verify-replacement-worker-runtime.yml"
      - "runtime-activation/replacement-verify.trigger"

permissions:
  contents: write

concurrency:
  group: comebackhome-replacement-worker-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      WORKER_ORIGIN: https://come-back-home-runtime.ydh1121.workers.dev
      PAGES_ORIGIN: https://come-back-home.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify replacement runtime and cutover prerequisites
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const kakaoKey = process.env.KAKAO_REST_API_KEY;
          if (!token || !accountId || !kakaoKey) {
            throw new Error('Required verification credentials are missing');
          }

          const headers = { Authorization: 'Bearer ' + token };
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const databaseId = config.d1_databases?.[0]?.database_id;
          if (!databaseId) throw new Error('D1 binding id missing');

          if (config.preview_urls !== false) throw new Error('Preview URLs must be disabled');
          if (config.vars?.MUTATIONS_ENABLED !== '1') throw new Error('Mutations must be enabled');
          if (config.vars?.PROVIDER_RUNTIME_ENABLED !== '1') throw new Error('Provider runtime must be enabled');
          if (config.vars?.PUSH_DELIVERY_ENABLED !== '1') throw new Error('Push delivery must be enabled');
          if (JSON.stringify(config.triggers?.crons ?? []) !== JSON.stringify(['* * * * *'])) {
            throw new Error('Canonical one-minute Cron missing');
          }

          async function cf(path, init = {}) {
            const response = await fetch(
              'https://api.cloudflare.com/client/v4/accounts/' + accountId + path,
              {
                ...init,
                headers: {
                  ...headers,
                  ...(init.headers ?? {}),
                },
              },
            );
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              throw new Error('Cloudflare API failure ' + path + ' HTTP ' + response.status);
            }
            return body.result;
          }

          const subdomainState = await cf('/workers/scripts/come-back-home-runtime/subdomain');
          if (subdomainState?.enabled !== true) {
            throw new Error('Production workers.dev route is not enabled');
          }
          if (subdomainState?.previews_enabled === true) {
            throw new Error('Preview URLs are still enabled');
          }

          const remoteSchedulesRaw = await cf('/workers/scripts/come-back-home-runtime/schedules');
          const remoteSchedules = Array.isArray(remoteSchedulesRaw)
            ? remoteSchedulesRaw
            : Array.isArray(remoteSchedulesRaw?.schedules)
              ? remoteSchedulesRaw.schedules
              : [];
          const actualCrons = remoteSchedules
            .map((item) => item?.cron)
            .filter((value) => typeof value === 'string')
            .sort();
          if (JSON.stringify(actualCrons) !== JSON.stringify(['* * * * *'])) {
            throw new Error('Remote Cron does not match canonical one-minute schedule');
          }

          const secrets = await cf('/workers/scripts/come-back-home-runtime/secrets');
          const secretNames = (Array.isArray(secrets) ? secrets : [])
            .map((item) => item?.name)
            .filter((name) => typeof name === 'string')
            .sort();
          for (const required of [
            'KAKAO_REST_API_KEY',
            'PRESENCE_EVENT_INGEST_TOKEN',
            'VAPID_PRIVATE_KEY',
          ]) {
            if (!secretNames.includes(required)) {
              throw new Error('Required Worker secret missing: ' + required);
            }
          }

          const settings = await cf('/workers/scripts/come-back-home-runtime/settings');
          const bindingNames = (Array.isArray(settings?.bindings) ? settings.bindings : [])
            .map((item) => item?.name)
            .filter((name) => typeof name === 'string')
            .sort();
          for (const required of [
            'DB',
            'MUTATIONS_ENABLED',
            'PROVIDER_RUNTIME_ENABLED',
            'PUSH_DELIVERY_ENABLED',
            'VAPID_PUBLIC_KEY',
            'VAPID_SUBJECT',
            'WEB_PUSH_TTL_SECONDS',
            'NOTIFICATION_RETRY_DELAYS_SECONDS',
          ]) {
            if (!bindingNames.includes(required)) {
              throw new Error('Remote Worker binding missing: ' + required);
            }
          }

          const deployments = await cf('/workers/scripts/come-back-home-runtime/deployments');
          const deploymentList = Array.isArray(deployments?.deployments)
            ? deployments.deployments
            : [];
          if (!deploymentList.length) throw new Error('Worker has no deployment');
          const currentDeployment = deploymentList[0];
          const deploymentVersions = Array.isArray(currentDeployment?.versions)
            ? currentDeployment.versions
            : [];
          const totalTraffic = deploymentVersions.reduce(
            (sum, item) => sum + Number(item?.percentage ?? 0),
            0,
          );
          if (!deploymentVersions.length || Math.abs(totalTraffic - 100) > 0.001) {
            throw new Error('Current Worker deployment does not account for 100% traffic');
          }

          const d1Sql = `
            SELECT
              (SELECT COUNT(*) FROM people) AS people,
              (SELECT COUNT(*) FROM schedules) AS schedules,
              (SELECT COUNT(*) FROM push_subscriptions) AS push_subscriptions,
              (SELECT COUNT(*) FROM push_subscriptions WHERE active = 1) AS active_push_subscriptions,
              (SELECT COUNT(*) FROM notification_jobs) AS notification_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status IN ('pending', 'retry', 'processing')) AS live_jobs,
              (SELECT COUNT(*) FROM notification_settings) AS notification_settings
          `;
          const d1Response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
              '/d1/database/' + databaseId + '/query',
            {
              method: 'POST',
              headers: {
                ...headers,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ sql: d1Sql }),
            },
          );
          const d1Body = await d1Response.json();
          if (!d1Response.ok || d1Body.success !== true) {
            throw new Error('D1 verification query failed');
          }
          const d1Pages = Array.isArray(d1Body.result) ? d1Body.result : [d1Body.result];
          const d1Rows = d1Pages.flatMap((page) => Array.isArray(page?.results) ? page.results : []);
          const d1 = d1Rows[0];
          if (!d1 || Number(d1.notification_settings ?? 0) !== 1) {
            throw new Error('D1 notification settings baseline is invalid');
          }

          const workerResponse = await fetch(process.env.WORKER_ORIGIN + '/api/health', {
            redirect: 'manual',
          });
          if (workerResponse.status === 200) {
            throw new Error('Access perimeter failed: anonymous Worker request returned 200');
          }
          if (![302, 403].includes(workerResponse.status)) {
            throw new Error('Unexpected anonymous Worker status ' + workerResponse.status);
          }

          const pagesResponse = await fetch(process.env.PAGES_ORIGIN + '/', {
            redirect: 'manual',
          });
          if (!pagesResponse.ok) {
            throw new Error('Existing Pages fallback is not reachable');
          }
          const pagesHtml = await pagesResponse.text();
          if (!pagesHtml.includes('<title>ComeBackHome')) {
            throw new Error('Existing Pages fallback does not look like ComeBackHome');
          }

          const pagesProject = await cf('/pages/projects/come-back-home');
          if (pagesProject?.production_branch !== 'main') {
            throw new Error('Pages production branch is not main');
          }

          const kakaoHeaders = {
            Accept: 'application/json',
            Authorization: 'KakaoAK ' + kakaoKey,
          };
          async function kakaoJson(url, label) {
            const response = await fetch(url, { headers: kakaoHeaders });
            if (!response.ok) throw new Error(label + ' HTTP ' + response.status);
            return response.json();
          }

          const placeUrl = new URL('https://dapi.kakao.com/v2/local/search/keyword.json');
          placeUrl.searchParams.set('query', '서울역');
          placeUrl.searchParams.set('x', '126.9707');
          placeUrl.searchParams.set('y', '37.5547');
          placeUrl.searchParams.set('sort', 'distance');
          const placeBody = await kakaoJson(placeUrl, 'Kakao place search');
          const placeCount = Array.isArray(placeBody?.documents) ? placeBody.documents.length : 0;
          if (placeCount < 1) throw new Error('Kakao place search returned no result');

          const routeUrl = new URL('https://dapi.kakao.com/v2/routing/publictraffic');
          routeUrl.searchParams.set('start_x', '127.11119217');
          routeUrl.searchParams.set('start_y', '37.39477123');
          routeUrl.searchParams.set('end_x', '127.12628814');
          routeUrl.searchParams.set('end_y', '37.41993056');
          routeUrl.searchParams.set('input_coord', 'WGS84');
          routeUrl.searchParams.set('output_coord', 'WGS84');
          const routeBody = await kakaoJson(routeUrl, 'Kakao public transit');
          const routes = Array.isArray(routeBody?.routes) ? routeBody.routes : [];
          const totalTimes = routes
            .map((route) => Number(route?.properties?.totalTime))
            .filter((value) => Number.isFinite(value) && value > 0);
          if (routeBody?.status !== 'OK' || routes.length < 1 || totalTimes.length < 1) {
            throw new Error('Kakao public transit returned no ETA-bearing route');
          }

          const pagesSource = pagesProject?.source?.config ?? {};
          const evidence = {
            workerName: 'come-back-home-runtime',
            workersDevEnabled: true,
            previewUrlsEnabled: false,
            accessAnonymousBlocked: true,
            mutationsEnabled: true,
            providerRuntimeEnabled: true,
            pushDeliveryEnabled: true,
            cron: '* * * * *',
            cronMatchesRemote: true,
            requiredWorkerSecretNamesPresent: true,
            remoteBindingNames: bindingNames,
            currentDeploymentId: currentDeployment?.id ?? null,
            deploymentVersionCount: deploymentVersions.length,
            deploymentTrafficPercent: totalTraffic,
            d1: {
              people: Number(d1.people ?? 0),
              schedules: Number(d1.schedules ?? 0),
              pushSubscriptions: Number(d1.push_subscriptions ?? 0),
              activePushSubscriptions: Number(d1.active_push_subscriptions ?? 0),
              notificationJobs: Number(d1.notification_jobs ?? 0),
              liveJobs: Number(d1.live_jobs ?? 0),
              notificationSettings: Number(d1.notification_settings ?? 0),
            },
            providerProbe: {
              placeResultCount: placeCount,
              routeCount: routes.length,
              minimumTransitSeconds: Math.min(...totalTimes),
            },
            pagesFallback: {
              reachable: true,
              productionBranch: pagesProject?.production_branch ?? null,
              productionDeploymentsEnabled:
                pagesSource.production_deployments_enabled ?? pagesSource.deployments_enabled ?? null,
              previewDeploymentSetting: pagesSource.preview_deployment_setting ?? null,
            },
            cutover: {
              automatedReplacementChecks: 'PASS',
              authenticatedOwnerProductTest: 'PENDING',
              pagesTrafficCutoverPerformed: false,
            },
            valuesExposed: false,
          };

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/replacement-worker-verification.json',
            JSON.stringify(evidence, null, 2) + '\n',
          );

          console.log(JSON.stringify({
            automatedReplacementChecks: evidence.cutover.automatedReplacementChecks,
            previewUrlsEnabled: evidence.previewUrlsEnabled,
            cron: evidence.cron,
            d1People: evidence.d1.people,
            activePushSubscriptions: evidence.d1.activePushSubscriptions,
            kakaoRouteCount: evidence.providerProbe.routeCount,
            pagesFallbackReachable: evidence.pagesFallback.reachable,
            valuesExposed: false,
          }));
          NODE

      - name: Commit sanitized replacement verification evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/replacement-worker-verification.json
          git diff --cached --quiet || git commit -m "chore: record replacement Worker verification"
          git push
