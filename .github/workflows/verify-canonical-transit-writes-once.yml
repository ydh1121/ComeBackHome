name: Canonical Reversible Transit Write QA
on:
  push:
    branches: [main]
    paths:
      - "runtime-activation/cbh-reversible-d1-qa.trigger"
permissions:
  contents: read
concurrency:
  group: cbh-production-transit-reversible-qa
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CBH_REVERSIBLE_PRODUCTION_QA: APPROVED_ONE_RUN
      CBH_ROUTE_QA: APPROVED_ONE_RUN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check scripts/verify-canonical-transit-writes-reversible.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: sleep 45
      - name: Verify UI→D1→reload and restore original flags
        run: node scripts/verify-canonical-transit-writes-reversible.mjs
      # Only run route mutation AFTER the origin/destination selection test
      # restored its original database flags successfully.
      - name: Verify preferred route→Today/ETA and restore original route
        run: node scripts/verify-saved-route-once.mjs
