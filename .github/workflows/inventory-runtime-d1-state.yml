name: Inventory Runtime D1 State

on:
  workflow_dispatch:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/inventory-runtime-d1-state.yml"
      - "runtime-activation/d1-inventory.trigger"

permissions:
  contents: read

concurrency:
  group: comebackhome-runtime-d1-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query sanitized D1 row counts only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare credentials are missing');

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const databaseId = config.d1_databases?.[0]?.database_id;
          if (!databaseId) throw new Error('D1 database id is missing from wrangler config');

          const sql = `
            SELECT
              (SELECT COUNT(*) FROM people) AS people,
              (SELECT COUNT(*) FROM places) AS places,
              (SELECT COUNT(*) FROM schedules) AS schedules,
              (SELECT COUNT(*) FROM notification_settings) AS notification_settings,
              (SELECT COUNT(*) FROM push_subscriptions) AS push_subscriptions,
              (SELECT COUNT(*) FROM push_subscriptions WHERE active = 1) AS active_push_subscriptions,
              (SELECT COUNT(*) FROM notification_jobs) AS notification_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status = 'pending') AS pending_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status = 'retry') AS retry_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status = 'failed') AS failed_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status = 'sent') AS sent_jobs,
              (SELECT COUNT(*) FROM notification_planner_state) AS planner_state_rows
          `;

          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
              '/d1/database/' + databaseId + '/query',
            {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ sql }),
            },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true) {
            throw new Error('D1 count query failed with HTTP ' + response.status);
          }

          const resultPages = Array.isArray(body.result) ? body.result : [body.result];
          const rows = resultPages.flatMap((page) => Array.isArray(page?.results) ? page.results : []);
          const row = rows[0];
          if (!row) throw new Error('D1 count query returned no row');

          const keys = [
            'people',
            'places',
            'schedules',
            'notification_settings',
            'push_subscriptions',
            'active_push_subscriptions',
            'notification_jobs',
            'pending_jobs',
            'retry_jobs',
            'failed_jobs',
            'sent_jobs',
            'planner_state_rows',
          ];
          const sanitized = Object.fromEntries(keys.map((key) => [key, Number(row[key] ?? 0)]));
          sanitized.valuesExposed = false;
          console.log(JSON.stringify(sanitized));
          NODE
