name: PR92 owner-authorized production release
run-name: PR92 production rollout / owner approved 2026-10-17

# The owner explicitly requested MAIN merge and use of the new version.
# This branch-scoped trigger is used because the connected GitHub interface
# supports code writes but has no workflow-dispatch operation. It does not
# mutate on MAIN, on unrelated changes, or on other PR branches. MAIN runs
# only the read-only deployment verification below.
on:
  push:
    branches: [feat/nonimage-weekly-xlsx-import, main]
    paths: [.github/workflows/release-pr92-production.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cbh-pr92-production-release
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'ydh1121/ComeBackHome' && github.ref == 'refs/heads/feat/nonimage-weekly-xlsx-import'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_CORE_SHA: 855bfa4438be1c6bbf4ffb6e221295564f4ee94bfb37980d377f686289ac5361
      BACKUP_DRIVE_ID: 15XNrTWKy3mK9ThnzNSfczwPABSo5RpKr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Enforce one-time owner approval window
        run: node -e "if (Date.now() > Date.parse('2026-10-18T14:59:59Z')) throw new Error('This release authorization window has ended')"
      - name: Wait for current-commit required CI before production migration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const headers = { Authorization: 'Bearer ' + process.env.GITHUB_TOKEN, Accept: 'application/vnd.github+json' };
          const base = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
          for (let attempt = 0; attempt < 90; attempt++) {
            const response = await fetch(base + '/actions/runs?head_sha=' + process.env.GITHUB_SHA + '&event=pull_request&per_page=100', {headers});
            if (!response.ok) throw new Error('Cannot read required CI');
            const runs = (await response.json()).workflow_runs.filter(run => run.name === 'Phase 5G Local Integration');
            const run = runs.sort((a,b) => b.id-a.id)[0];
            if (run?.status === 'completed') {
              if (run.conclusion !== 'success') throw new Error('Required CI did not pass: ' + run.conclusion);
              const jobsResponse = await fetch(base + '/actions/runs/' + run.id + '/jobs?per_page=100', {headers});
              if (!jobsResponse.ok) throw new Error('Cannot verify required jobs');
              const jobs = (await jobsResponse.json()).jobs;
              if (jobs.filter(job => job.conclusion === 'success').length !== 12 || jobs.some(job => !['success','skipped'].includes(job.conclusion))) throw new Error('Required job acceptance mismatch');
              console.log(JSON.stringify({requiredRun:run.id,requiredSuccess:12,head:process.env.GITHUB_SHA}));
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 20000));
          }
          throw new Error('Timed out waiting for required CI; no production migration executed');
          NODE
      - name: Apply only approved additive migrations and verify protected data
        run: node scripts/release-pr92-production.mjs migrate
      - name: Publish aggregate migration evidence only
        uses: actions/upload-artifact@v4
        with:
          name: cbh-pr92-release-migration
          path: runtime-evidence/pr92-release/
          retention-days: 7
          if-no-files-found: error

  verify-production:
    if: github.repository == 'ydh1121/ComeBackHome' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Wait for canonical Pages to serve this exact MAIN commit
        run: |
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 90; attempt++) {
            try {
              const response = await fetch('https://come-back-home.pages.dev/api/health', {cache:'no-store'});
              const health = await response.json();
              if (response.ok && health.ok === true && health.commitSha === process.env.GITHUB_SHA) {
                console.log(JSON.stringify({canonicalHealth:true,commitSha:health.commitSha}));process.exit(0);
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Canonical Pages did not serve the approved MAIN commit');
          NODE
      - name: Read production schema and data after deployment
        run: node scripts/release-pr92-production.mjs verify
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Verify actual deployed screens without writes or test notifications
        run: |
          node --input-type=module <<'NODE'
          import {chromium,webkit} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const results=[];
          for (const [name,type] of [['chromium',chromium],['webkit',webkit]]) {
            const browser=await type.launch({headless:true});
            try {
              const context=await browser.newContext({viewport:{width:390,height:844},locale:'ko-KR',timezoneId:'Asia/Seoul',serviceWorkers:'block'});
              const writes=[],errors=[];
              await context.route('**/api/**', async route=>{
                if(!['GET','HEAD','OPTIONS'].includes(route.request().method())){writes.push(route.request().method());await route.abort();return;}
                await route.continue();
              });
              const page=await context.newPage();page.on('pageerror',error=>errors.push(error.name));
              const origin='https://come-back-home.pages.dev';
              await page.goto(origin+'/settings',{waitUntil:'domcontentloaded'});
              await page.locator('[data-page="SettingsPage"]').waitFor();
              assert.equal(await page.getByRole('button',{name:'iPhone 시계 알람',exact:true}).count(),0);
              await page.goto(origin+'/settings/alarms',{waitUntil:'domcontentloaded'});
              await page.locator('[data-page="SettingsPage"]').waitFor();
              assert.equal(await page.locator('[data-page="AlarmPage"]').count(),0);
              await page.goto(origin+'/schedule',{waitUntil:'domcontentloaded'});
              await page.locator('[data-page="SchedulePage"][data-state="VIEW_DAY"], [data-page="SchedulePage"][data-state="EMPTY"]').waitFor();
              const settingsResponse=await context.request.get(origin+'/api/notifications/settings');
              assert.equal(settingsResponse.status(),200);
              assert.equal(typeof (await settingsResponse.json()).settings.arrivalAdvanceEnabled,'boolean');
              await page.goto(origin+'/import',{waitUntil:'domcontentloaded'});
              await page.locator('input[accept=".xlsx"]').waitFor({state:'attached'});
              assert.ok(await page.locator('input[type="file"]').count()>=2);
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              assert.deepEqual(writes,[]);assert.deepEqual(errors,[]);
              results.push({browser:name,settings:true,manualClockExcluded:true,schedule:true,imageAndXlsxImport:true,mobileFits:true,appWrites:0,consoleErrors:0});
              await context.close();
            } finally {await browser.close();}
          }
          writeFileSync('runtime-evidence/pr92-release/production-browser.json',JSON.stringify({commitSha:process.env.GITHUB_SHA,results},null,2));
          console.log(JSON.stringify({productionBrowserReadOnly:'PASS',browsers:results.map(item=>item.browser),appWrites:0,testNotificationsSent:0}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cbh-pr92-production-readonly
          path: runtime-evidence/pr92-release/
          retention-days: 7
          if-no-files-found: error
