name: Probe Kakao Provider Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/probe-kakao-provider-runtime.yml"
      - "runtime-activation/provider-probe.trigger"

permissions:
  contents: read

concurrency:
  group: comebackhome-kakao-provider-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
    steps:
      - name: Verify Kakao secret presence
        shell: bash
        run: test -n "$KAKAO_REST_API_KEY"

      - name: Probe Kakao place and public-transit APIs without exposing secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.KAKAO_REST_API_KEY?.trim();
          if (!key) throw new Error('KAKAO_REST_API_KEY is missing');

          const headers = {
            Accept: 'application/json',
            Authorization: 'KakaoAK ' + key,
          };

          async function getJson(url, label) {
            const response = await fetch(url, { headers });
            if (!response.ok) {
              throw new Error(label + ' HTTP ' + response.status);
            }
            return response.json();
          }

          const placeUrl = new URL('https://dapi.kakao.com/v2/local/search/keyword.json');
          placeUrl.searchParams.set('query', '서울역');
          placeUrl.searchParams.set('x', '126.9707');
          placeUrl.searchParams.set('y', '37.5547');
          placeUrl.searchParams.set('sort', 'distance');

          const placeBody = await getJson(placeUrl, 'place-search');
          const placeCount = Array.isArray(placeBody?.documents) ? placeBody.documents.length : 0;
          if (placeCount < 1) {
            throw new Error('place-search returned no documents');
          }

          const routeUrl = new URL('https://dapi.kakao.com/v2/routing/publictraffic');
          routeUrl.searchParams.set('start_x', '127.11119217');
          routeUrl.searchParams.set('start_y', '37.39477123');
          routeUrl.searchParams.set('end_x', '127.12628814');
          routeUrl.searchParams.set('end_y', '37.41993056');
          routeUrl.searchParams.set('input_coord', 'WGS84');
          routeUrl.searchParams.set('output_coord', 'WGS84');

          const routeBody = await getJson(routeUrl, 'public-transit-routing');
          const routes = Array.isArray(routeBody?.routes) ? routeBody.routes : [];
          const totalTimes = routes
            .map((route) => Number(route?.properties?.totalTime))
            .filter((value) => Number.isFinite(value) && value > 0);

          if (routeBody?.status !== 'OK' || routes.length < 1 || totalTimes.length < 1) {
            throw new Error('public-transit-routing returned no valid ETA-bearing route');
          }

          console.log(JSON.stringify({
            placeSearchOk: true,
            placeResultCount: placeCount,
            publicTransitOk: true,
            routeCount: routes.length,
            minimumTransitSeconds: Math.min(...totalTimes),
            valuesExposed: false,
          }));
          NODE
