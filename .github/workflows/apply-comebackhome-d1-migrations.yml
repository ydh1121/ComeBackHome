name: Apply ComeBackHome D1 Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_REMOTE_COMEBACKHOME_D1 (separate user approval is still mandatory)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'APPLY_REMOTE_COMEBACKHOME_D1'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply remote migrations
        run: npx wrangler d1 migrations apply come-back-home-db --remote --config wrangler.jsonc

      - name: Verify applied migration ledger
        run: |
          npx wrangler d1 execute come-back-home-db             --remote             --config wrangler.jsonc             --command "SELECT name FROM d1_migrations ORDER BY name;"             --json > /tmp/d1-migrations.json

      - name: Verify required tables
        run: |
          npx wrangler d1 execute come-back-home-db             --remote             --config wrangler.jsonc             --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"             --json > /tmp/d1-tables.json

      - name: Write migration evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const migrationRaw = JSON.parse(fs.readFileSync('/tmp/d1-migrations.json', 'utf8'));
          const tableRaw = JSON.parse(fs.readFileSync('/tmp/d1-tables.json', 'utf8'));

          const flatten = (payload) => {
            if (Array.isArray(payload)) {
              return payload.flatMap((item) => item?.results ?? item?.result?.results ?? []);
            }
            return payload?.results ?? payload?.result?.results ?? [];
          };

          const migrations = flatten(migrationRaw)
            .map((row) => row.name)
            .filter(Boolean)
            .sort();

          const tables = flatten(tableRaw)
            .map((row) => row.name)
            .filter(Boolean)
            .sort();

          const expectedMigrations = fs.readdirSync('db/migrations')
            .filter((name) => /^\d{4}_.+\.sql$/.test(name))
            .sort();
          if (!expectedMigrations.length) throw new Error('No repository migration SQL files found');
          if (expectedMigrations.length !== migrations.length ||
              expectedMigrations.some((name, index) => migrations[index] !== name)) {
            throw new Error('Remote migration ledger differs from repository SQL migration names');
          }

          const requiredTables = [
            'people',
            'schedules',
            'places',
            'notification_settings',
            'push_subscriptions',
            'notification_jobs',
            'notification_planner_state',
            'saved_commute_routes',
            'saved_commute_route_vias',
            'saved_commute_route_origins',
            'saved_commute_route_destinations',
            'presence_state',
          ];

          for (const table of requiredTables) {
            if (!tables.includes(table)) {
              throw new Error('Missing required table: ' + table);
            }
          }

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/cloudflare-d1-migrations.json',
            JSON.stringify({
              databaseName: 'come-back-home-db',
              remote: true,
              appliedMigrations: migrations,
              verifiedTables: requiredTables,
              migrationCount: migrations.length,
              tableCount: tables.length,
            }, null, 2) + '\n',
          );
          NODE

      - name: Upload migration evidence without modifying source history
        uses: actions/upload-artifact@v4
        with:
          name: cbh-d1-migration-ledger
          path: runtime-evidence/cloudflare-d1-migrations.json
          retention-days: 7
          if-no-files-found: error
