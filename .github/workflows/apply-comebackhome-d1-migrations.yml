name: Apply ComeBackHome D1 Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "로그인 DB 0012 추가 승인: APPLY_REMOTE_COMEBACKHOME_D1 입력 (기존 일정 보존, 계정 등록 별도)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: comebackhome-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'APPLY_REMOTE_COMEBACKHOME_D1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify setup safeguards locally (no production credentials)
        run: node --test test/private-work/login-db-setup.test.mjs
      - name: Check recovery point and apply only the missing login schema
        run: node scripts/private-work/prepare-login-db.mjs
        env:
          CBH_D1_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
