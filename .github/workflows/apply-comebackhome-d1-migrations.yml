name: Apply ComeBackHome D1 Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - activation/runtime-phase1
      - main
    paths:
      - ".github/workflows/apply-comebackhome-d1-migrations.yml"
      - "db/migrations/**"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply remote migrations
        run: npx wrangler d1 migrations apply come-back-home-db --remote --config wrangler.jsonc

      - name: Verify applied migration ledger
        run: |
          npx wrangler d1 execute come-back-home-db             --remote             --config wrangler.jsonc             --command "SELECT name FROM d1_migrations ORDER BY name;"             --json > /tmp/d1-migrations.json

      - name: Verify required tables
        run: |
          npx wrangler d1 execute come-back-home-db             --remote             --config wrangler.jsonc             --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"             --json > /tmp/d1-tables.json

      - name: Write migration evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const migrationRaw = JSON.parse(fs.readFileSync('/tmp/d1-migrations.json', 'utf8'));
          const tableRaw = JSON.parse(fs.readFileSync('/tmp/d1-tables.json', 'utf8'));

          const flatten = (payload) => {
            if (Array.isArray(payload)) {
              return payload.flatMap((item) => item?.results ?? item?.result?.results ?? []);
            }
            return payload?.results ?? payload?.result?.results ?? [];
          };

          const migrations = flatten(migrationRaw)
            .map((row) => row.name)
            .filter(Boolean)
            .sort();

          const tables = flatten(tableRaw)
            .map((row) => row.name)
            .filter(Boolean)
            .sort();

          const expectedMigrations = [
            '0001_initial.sql',
            '0002_notification_planner_state.sql',
            '0003_presence_notification_settings.sql',
            '0004_saved_commute_routes.sql',
          ];

          for (const migration of expectedMigrations) {
            if (!migrations.includes(migration)) {
              throw new Error('Missing applied migration: ' + migration);
            }
          }

          const requiredTables = [
            'people',
            'schedules',
            'places',
            'notification_settings',
            'push_subscriptions',
            'notification_jobs',
            'notification_planner_state',
            'saved_commute_routes',
            'saved_commute_route_vias',
          ];

          for (const table of requiredTables) {
            if (!tables.includes(table)) {
              throw new Error('Missing required table: ' + table);
            }
          }

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/cloudflare-d1-migrations.json',
            JSON.stringify({
              databaseName: 'come-back-home-db',
              remote: true,
              appliedMigrations: expectedMigrations,
              verifiedTables: requiredTables,
              migrationCount: migrations.length,
              tableCount: tables.length,
            }, null, 2) + '\n',
          );
          NODE

      - name: Commit migration evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/cloudflare-d1-migrations.json
          git diff --cached --quiet || git commit -m "chore: record remote D1 migrations"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
