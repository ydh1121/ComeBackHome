name: Inspect canonical Pages deployment (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/inspect-pages-deployment.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ydh1121/ComeBackHome' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read deployment metadata without changing settings or processing jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('Existing Cloudflare connection unavailable');
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/come-back-home';
          async function read(path) {
            const response = await fetch(base + path, { method: 'GET', headers: { Authorization: 'Bearer ' + token }, signal: AbortSignal.timeout(20000) });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error('Cloudflare metadata GET failed: HTTP ' + response.status);
            return body.result;
          }
          const [project, deployments] = await Promise.all([read(''), read('/deployments?env=production&per_page=5')]);
          const deployment = d => d ? { id: d.id, environment: d.environment, commit: d.deployment_trigger?.metadata?.commit_hash, stage: d.latest_stage?.name, status: d.latest_stage?.status, created: d.created_on } : null;
          console.log(JSON.stringify({
            project: project.name, productionBranch: project.production_branch,
            enabled: project.source?.config?.production_deployments_enabled,
            latest: deployment(project.latest_deployment), canonical: deployment(project.canonical_deployment),
            recent: deployments.map(deployment),
            appWrites: 0, settingChanges: 0, schedulerTicksSent: 0, secretValuesExposed: false,
          }));
          const health = await fetch('https://come-back-home.pages.dev/api/health', { method: 'GET', cache: 'no-store', signal: AbortSignal.timeout(20000) });
          const body = await health.json().catch(() => null);
          console.log(JSON.stringify({healthStatus:health.status,ok:body?.ok===true,commit:body?.commitSha??null}));
          NODE
