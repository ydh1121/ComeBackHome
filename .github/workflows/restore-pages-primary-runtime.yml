name: Restore Pages Primary Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-pages-primary-runtime.yml"
      - "runtime-activation/pages-primary.trigger"
      - "functions/api/**"

permissions:
  contents: read

concurrency:
  group: comebackhome-pages-primary-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_ORIGIN: https://come-back-home.pages.dev
      PAGES_PROJECT: come-back-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Restore Pages production config and backend binding
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.PAGES_PROJECT;
          const projectUrl =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/' + projectName;
          const authHeaders = { Authorization: 'Bearer ' + token };

          const beforeResponse = await fetch(projectUrl, { headers: authHeaders });
          const beforeBody = await beforeResponse.json();
          if (!beforeResponse.ok || beforeBody.success !== true) {
            throw new Error('Failed to read Pages project');
          }
          if (beforeBody.result?.production_branch !== 'main') {
            throw new Error('Pages production branch is not main');
          }

          const workerConfig = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const publicKey = workerConfig.vars?.VAPID_PUBLIC_KEY ?? '';
          if (!/^[A-Za-z0-9_-]{80,100}$/.test(publicKey)) {
            throw new Error('VAPID public key is unavailable for Pages build');
          }

          const runtimeEnv = {
            VITE_CBH_RUNTIME: { type: 'plain_text', value: 'api' },
            VITE_CBH_PROVIDER_RUNTIME: { type: 'plain_text', value: 'api' },
            VITE_CBH_VAPID_PUBLIC_KEY: { type: 'plain_text', value: publicKey },
          };
          const serviceBinding = {
            CBH_RUNTIME: {
              service: 'come-back-home-runtime',
              environment: 'production',
            },
          };

          const patchResponse = await fetch(projectUrl, {
            method: 'PATCH',
            headers: {
              ...authHeaders,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              build_config: {
                build_command: 'npm run build',
                destination_dir: 'dist',
                root_dir: '/',
              },
              source: {
                config: {
                  production_deployments_enabled: true,
                  preview_deployment_setting: 'all',
                },
              },
              deployment_configs: {
                production: {
                  env_vars: runtimeEnv,
                  services: serviceBinding,
                },
                preview: {
                  env_vars: runtimeEnv,
                  services: serviceBinding,
                },
              },
            }),
          });
          const patchBody = await patchResponse.json();
          if (!patchResponse.ok || patchBody.success !== true) {
            throw new Error('Failed to restore Pages production configuration');
          }

          const readbackResponse = await fetch(projectUrl, { headers: authHeaders });
          const readbackBody = await readbackResponse.json();
          if (!readbackResponse.ok || readbackBody.success !== true) {
            throw new Error('Failed to read back Pages project');
          }

          const project = readbackBody.result;
          const sourceConfig = project?.source?.config ?? {};
          const production = project?.deployment_configs?.production ?? {};
          if (sourceConfig.production_deployments_enabled !== true) {
            throw new Error('Pages production auto-deploy is not enabled');
          }
          if (sourceConfig.preview_deployment_setting !== 'all') {
            throw new Error('Pages preview deployment setting is not restored');
          }
          if (production.services?.CBH_RUNTIME?.service !== 'come-back-home-runtime') {
            throw new Error('Pages Worker service binding is missing');
          }
          if (production.env_vars?.VITE_CBH_RUNTIME?.value !== 'api') {
            throw new Error('Pages browser runtime is not API mode');
          }
          if (production.env_vars?.VITE_CBH_PROVIDER_RUNTIME?.value !== 'api') {
            throw new Error('Pages provider runtime is not API mode');
          }

          console.log(JSON.stringify({
            productionDeploymentsEnabled: true,
            previewDeploymentSetting: 'all',
            serviceBinding: 'CBH_RUNTIME',
            boundService: 'come-back-home-runtime',
            browserRuntime: 'api',
            providerRuntime: 'api',
            buildOutput: project?.build_config?.destination_dir ?? null,
            valuesExposed: false,
          }));
          NODE

      - name: Trigger production Pages deployment from main
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.PAGES_PROJECT;
          const deployUrl =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/' + projectName + '/deployments';

          const form = new FormData();
          form.set('branch', 'main');
          form.set('commit_hash', process.env.GITHUB_SHA ?? '');
          form.set('commit_dirty', 'false');
          form.set('commit_message', 'Restore Pages primary runtime');

          const response = await fetch(deployUrl, {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token },
            body: form,
          });
          const body = await response.json();
          if (!response.ok || body.success !== true || !body.result?.id) {
            throw new Error('Failed to trigger Pages production deployment');
          }

          fs.appendFileSync(process.env.GITHUB_ENV, 'PAGES_DEPLOYMENT_ID=' + body.result.id + '\n');
          console.log('Pages deployment triggered');
          NODE

      - name: Wait for Pages production deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.PAGES_PROJECT;
          const deploymentId = process.env.PAGES_DEPLOYMENT_ID;
          const url =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/' + projectName + '/deployments/' + deploymentId;

          for (let attempt = 0; attempt < 60; attempt += 1) {
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + token },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              throw new Error('Failed to read Pages deployment');
            }

            const deployment = body.result;
            const stage =
              deployment?.latest_stage?.status ??
              deployment?.stages?.find((item) => item?.name === 'deploy')?.status ??
              deployment?.stages?.at(-1)?.status ??
              'unknown';

            if (stage === 'success') {
              if (deployment?.uses_functions !== true) {
                throw new Error('Pages deployment does not include Functions');
              }
              console.log(JSON.stringify({
                deploymentId,
                status: stage,
                usesFunctions: true,
                environment: deployment?.environment ?? null,
                valuesExposed: false,
              }));
              process.exit(0);
            }

            if (['failure', 'canceled', 'skipped'].includes(stage)) {
              throw new Error('Pages deployment ended with status ' + stage);
            }

            await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          throw new Error('Timed out waiting for Pages deployment');
          NODE

      - name: Verify Pages app and same-origin API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.PAGES_ORIGIN;

          const rootResponse = await fetch(origin + '/', { redirect: 'manual' });
          if (!rootResponse.ok) {
            throw new Error('Pages application root is not reachable: HTTP ' + rootResponse.status);
          }

          const healthResponse = await fetch(origin + '/api/health', {
            headers: { Accept: 'application/json' },
            redirect: 'manual',
          });
          const healthText = await healthResponse.text();
          let healthBody = null;
          try {
            healthBody = JSON.parse(healthText);
          } catch {
            healthBody = null;
          }
          if (!healthResponse.ok || healthBody?.ok !== true) {
            const contentType = healthResponse.headers.get('content-type') ?? 'unknown';
            const preview = healthText.slice(0, 120).replace(/\s+/g, ' ');
            throw new Error(
              'Pages same-origin API proxy failed: HTTP ' +
              healthResponse.status +
              ' content-type=' +
              contentType +
              ' body=' +
              preview,
            );
          }

          console.log(JSON.stringify({
            pagesRootReachable: true,
            sameOriginApiHealth: true,
            canonicalUserOrigin: origin + '/',
            backendPublicOriginRequiredByBrowser: false,
            valuesExposed: false,
          }));
          NODE
