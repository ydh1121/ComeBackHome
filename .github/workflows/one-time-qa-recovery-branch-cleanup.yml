name: One-Time QA Recovery Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-qa-recovery-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete completed recovery branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/client-config-prod-diagnostic"
            "fix/kakao-client-config-smoke-fallback"
            "fix/kakao-pages-runtime-alias"
            "fix/real-device-qa-repair-102"
            "fix/real-device-qa-repair-103"
            "fix/verify-kakao-client-runtime-config"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

      - name: Verify canonical branch set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin |
            awk '{sub("refs/heads/","",$2); print $2}' |
            sort
          )
          printf 'branches=%s\n' "${branches[*]}"
          if [ "${#branches[@]}" -ne 1 ] || [ "${branches[0]}" != "main" ]; then
            echo "Unexpected branches remain" >&2
            exit 1
          fi
