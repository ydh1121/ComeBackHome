name: Finalize Pages To Worker Cutover

on:
  workflow_dispatch:
    inputs:
      authenticated_owner_product_test:
        description: "Confirmed authenticated owner product test on replacement Worker"
        required: true
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: comebackhome-pages-worker-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://come-back-home-runtime.ydh1121.workers.dev
      PAGES_ORIGIN: https://come-back-home.pages.dev
    steps:
      - name: Require main and authenticated owner verification
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main"
          test "${{ inputs.authenticated_owner_product_test }}" = "true"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify replacement evidence is cutover-ready
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(
            fs.readFileSync('runtime-evidence/replacement-worker-verification.json', 'utf8'),
          );
          if (evidence?.cutover?.automatedReplacementChecks !== 'PASS') {
            throw new Error('Replacement Worker automated verification is not PASS');
          }
          if (evidence?.previewUrlsEnabled !== false) {
            throw new Error('Replacement Worker preview URLs are not disabled');
          }
          if (evidence?.accessAnonymousBlocked !== true) {
            throw new Error('Replacement Worker Access perimeter is not verified');
          }
          if (
            evidence?.providerRuntimeEnabled !== true ||
            evidence?.pushDeliveryEnabled !== true ||
            evidence?.cronMatchesRemote !== true
          ) {
            throw new Error('Replacement runtime activation is incomplete');
          }
          NODE

      - name: Disable Pages automatic deployments and retain fallback origin
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare credentials are missing');

          const headers = {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json',
          };
          const projectUrl =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/come-back-home';

          const beforeResponse = await fetch(projectUrl, {
            headers: { Authorization: 'Bearer ' + token },
          });
          const beforeBody = await beforeResponse.json();
          if (!beforeResponse.ok || beforeBody.success !== true) {
            throw new Error(
              'Pages project read failed; token must include Pages project read/write permission',
            );
          }
          if (beforeBody.result?.production_branch !== 'main') {
            throw new Error('Pages production branch is not main');
          }

          const patchResponse = await fetch(projectUrl, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({
              source: {
                config: {
                  production_deployments_enabled: false,
                  preview_deployment_setting: 'none',
                },
              },
            }),
          });
          const patchBody = await patchResponse.json();
          if (!patchResponse.ok || patchBody.success !== true) {
            throw new Error('Failed to disable Pages automatic deployments');
          }

          const readbackResponse = await fetch(projectUrl, {
            headers: { Authorization: 'Bearer ' + token },
          });
          const readbackBody = await readbackResponse.json();
          if (!readbackResponse.ok || readbackBody.success !== true) {
            throw new Error('Failed to read back Pages project after cutover');
          }
          const sourceConfig = readbackBody.result?.source?.config ?? {};
          if (sourceConfig.production_deployments_enabled !== false) {
            throw new Error('Pages production automatic deployments remain enabled');
          }
          if (sourceConfig.preview_deployment_setting !== 'none') {
            throw new Error('Pages preview automatic deployments remain enabled');
          }

          const fallbackResponse = await fetch(process.env.PAGES_ORIGIN + '/', {
            redirect: 'manual',
          });
          if (!fallbackResponse.ok) {
            throw new Error('Pages fallback origin stopped serving after disabling builds');
          }

          const workerResponse = await fetch(process.env.WORKER_ORIGIN + '/api/health', {
            redirect: 'manual',
          });
          if (workerResponse.status === 200 || ![302, 403].includes(workerResponse.status)) {
            throw new Error('Replacement Worker Access perimeter changed unexpectedly');
          }

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/pages-worker-cutover.json',
            JSON.stringify({
              canonicalRuntime: 'worker',
              canonicalWorkerUrl: process.env.WORKER_ORIGIN + '/',
              pagesOriginRetainedAsFallback: true,
              pagesOrigin: process.env.PAGES_ORIGIN + '/',
              pagesProductionAutomaticDeploymentsEnabled: false,
              pagesPreviewDeploymentSetting: 'none',
              authenticatedOwnerProductTestConfirmed: true,
              accessAnonymousBlockedAfterCutover: true,
              pagesDeleted: false,
              valuesExposed: false,
            }, null, 2) + '\n',
          );
          NODE

      - name: Commit sanitized cutover evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/pages-worker-cutover.json
          git diff --cached --quiet || git commit -m "chore: record Pages to Worker cutover"
          git push
