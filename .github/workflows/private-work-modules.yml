name: Private work modules (isolated only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'functions/**'
      - 'packages/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'tsconfig*.json'
      - 'db/migrations/**'
      - 'scripts/prepare-*.mjs'
      - 'scripts/generate-build-revision.mjs'
      - 'scripts/deploy-canonical-pages.mjs'
      - 'scripts/verify-private-work*'
      - 'scripts/verify-private-advisor.mjs'
      - 'scripts/verify-private-sheet-browser.mjs'
      - 'scripts/private-work/**'
      - 'scripts/verify-household*.mjs'
      - 'scripts/verify-portal-*.mjs'
      - 'scripts/verify-chat-drive-exchange.mjs'
      - 'test/private-work/**'
      - '.github/workflows/deploy-canonical-pages.yml'
      - '.github/workflows/private-work-modules.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'worker/**'
      - 'functions/**'
      - 'db/migrations/**'
      - 'scripts/verify-private-work*'
      - 'scripts/verify-private-advisor.mjs'
      - 'scripts/verify-private-sheet-browser.mjs'
      - 'scripts/private-work/**'
      - 'scripts/verify-household*.mjs'
      - 'scripts/verify-portal-*.mjs'
      - 'scripts/verify-chat-drive-exchange.mjs'
      - 'test/private-work/**'
      - '.github/workflows/private-work-modules.yml'
permissions:
  contents: read
concurrency:
  group: private-work-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-password:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell password hash interoperability
        shell: powershell
        run: ./scripts/private-work/Test-PrivateWorkPassword.ps1
        env:
          CBH_SYNTHETIC_HASH_VECTOR: 'gZ55cLN0OTnysLl5JNgQY/gg++302xGfLxHERoHIm3w='
      - name: Verify PowerShell 7 password hash interoperability
        shell: pwsh
        run: ./scripts/private-work/Test-PrivateWorkPassword.ps1
        env:
          CBH_SYNTHETIC_HASH_VECTOR: 'gZ55cLN0OTnysLl5JNgQY/gg++302xGfLxHERoHIm3w='
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run typecheck:worker
      - run: node scripts/verify-private-work.mjs
      - run: node scripts/private-work/verify-analysis-receipts.mjs
      - run: node scripts/private-work/verify-organization.mjs
      - run: node scripts/verify-household-domain.mjs
      - run: node scripts/verify-household-cache.mjs
      - run: node scripts/verify-household-storage.mjs
      - run: node scripts/verify-household-notifications.mjs
      - run: node scripts/verify-portal-preferences.mjs
      - run: node scripts/verify-chat-drive-exchange.mjs
      - run: node scripts/verify-private-advisor.mjs
      - run: node --test test/private-work/login-db-setup.test.mjs
      - run: node --test test/private-work/household-db-setup.test.mjs
      - run: node --test test/private-work/transit-cache-db-setup.test.mjs
      - run: node --test test/private-work/auth-runtime.test.mjs
      - run: node --test test/private-work/password-relief.test.mjs
      - run: node --test test/private-work/drive-runtime.test.mjs
      - run: node_modules/.bin/workerd test test/private-work/crypto-probe.capnp
  browser-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm run build
        id: production-build
        env:
          VITE_CBH_RUNTIME: api
          VITE_CBH_PROVIDER_RUNTIME: api
      - run: node scripts/verify-private-work-browser.mjs
      - run: node scripts/verify-household-browser.mjs
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
      - run: node scripts/verify-private-sheet-browser.mjs
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
      - run: node scripts/verify-household-card-art-browser.mjs
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
      - run: node scripts/verify-portal-navigation-browser.mjs
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-work-synthetic-browser-screenshots
          path: |
            artifacts/private-work/*.png
            artifacts/household/*.png
            artifacts/household/result.json
            artifacts/portal-navigation/*.png
            artifacts/portal-navigation/result.json
          retention-days: 7
