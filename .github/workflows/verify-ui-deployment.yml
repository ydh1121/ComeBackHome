name: Canonical UI deployment read-only verification
on:
  workflow_run:
    workflows: [Deploy canonical Pages after required CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: canonical-ui-readonly
  cancel-in-progress: true
jobs:
  verify-ui:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    env:
      CBH_EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Wait for exact canonical revision and verify screens without mutations
        run: node scripts/verify-pr94-production-readonly.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-ui-readonly
          path: runtime-evidence/ui-deploy/
          retention-days: 7
          if-no-files-found: error
