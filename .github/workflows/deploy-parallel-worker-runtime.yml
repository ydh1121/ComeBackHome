name: Deploy Parallel Worker Runtime

on:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/deploy-parallel-worker-runtime.yml"
      - "wrangler.jsonc"
      - "worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: comebackhome-parallel-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CBH_RUNTIME: api
      VITE_CBH_PROVIDER_RUNTIME: mock
      WORKER_ORIGIN: https://come-back-home-runtime.ydh1121.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify credentials exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build API runtime with provider disabled
        run: npm run build

      - name: Deploy isolated Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify read-only health
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error "$WORKER_ORIGIN/api/health")"
          test "$body" = '{"ok":true}'

      - name: Verify public mutations are blocked
        shell: bash
        run: |
          status="$(curl --silent --show-error             --output /tmp/mutation-body.json             --write-out "%{http_code}"             --request POST             --header "Content-Type: application/json"             --data '{"name":"must-not-write","relation":"blocked"}'             "$WORKER_ORIGIN/api/people")"
          test "$status" = "503"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/mutation-body.json', 'utf8'));
          if (body.error !== 'API mutations are temporarily disabled.') {
            throw new Error('Unexpected mutation gate response');
          }
          NODE

      - name: Record deployed Worker endpoint
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: 'Bearer ' + token };

          const accountResponse = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/workers/subdomain',
            { headers },
          );
          const accountBody = await accountResponse.json();
          if (!accountResponse.ok || accountBody.success !== true || !accountBody.result?.subdomain) {
            throw new Error('Failed to read Workers account subdomain');
          }

          const scriptResponse = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/workers/scripts/come-back-home-runtime/subdomain',
            { headers },
          );
          const scriptBody = await scriptResponse.json();
          if (!scriptResponse.ok || scriptBody.success !== true) {
            throw new Error('Failed to read Worker script subdomain state');
          }

          const subdomain = accountBody.result.subdomain;
          const workersDevEnabled = Boolean(scriptBody.result?.enabled ?? scriptBody.result?.previews_enabled ?? true);
          const url = 'https://come-back-home-runtime.' + subdomain + '.workers.dev/';

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/cloudflare-worker-runtime.json',
            JSON.stringify({
              workerName: 'come-back-home-runtime',
              accountSubdomain: subdomain,
              workersDevEnabled,
              url,
              clientRuntime: 'api',
              mutationsEnabled: false,
              providerRuntimeEnabled: false,
              pushDeliveryEnabled: false,
              d1Binding: 'DB',
              cronConfigured: false,
            }, null, 2) + '\n',
          );
          NODE

      - name: Commit deployment evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/cloudflare-worker-runtime.json
          git diff --cached --quiet || git commit -m "chore: record parallel Worker deployment"
          git push
