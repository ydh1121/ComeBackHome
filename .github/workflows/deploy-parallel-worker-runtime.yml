name: Deploy Parallel Worker Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - activation/runtime-phase1
      - main
    paths:
      - ".github/workflows/deploy-parallel-worker-runtime.yml"
      - "runtime-activation/deploy.trigger"
      - "wrangler.jsonc"
      - "worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: comebackhome-parallel-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CBH_RUNTIME: api
      VITE_CBH_PROVIDER_RUNTIME: api
      WORKER_ORIGIN: https://come-back-home-runtime.ydh1121.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify credentials exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Load public VAPID build key
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const publicKey = config.vars?.VAPID_PUBLIC_KEY ?? '';
          fs.appendFileSync(process.env.GITHUB_ENV, 'VITE_CBH_VAPID_PUBLIC_KEY=' + publicKey + '\n');
          NODE

      - name: Build D1 API runtime with provider enabled
        run: npm run build

      - name: Verify browser VAPID public key parity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const expected = config.vars?.VAPID_PUBLIC_KEY ?? '';
          if (!/^[A-Za-z0-9_-]{80,100}$/.test(expected)) {
            throw new Error('Worker public VAPID key is missing or invalid');
          }

          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          };
          walk('dist');

          const matched = files.some((file) => {
            try {
              return fs.readFileSync(file, 'utf8').includes(expected);
            } catch {
              return false;
            }
          });

          if (!matched) {
            throw new Error('Built browser assets do not contain the Worker public VAPID key');
          }

          console.log('Browser/Worker VAPID public key parity verified without exposing key material');
          NODE

      - name: Deploy isolated Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify anonymous traffic is blocked by Access
        shell: bash
        run: |
          status="$(curl --silent --show-error             --dump-header /tmp/access-headers.txt             --output /tmp/access-body.txt             --write-out "%{http_code}"             --max-time 20             "$WORKER_ORIGIN/api/health")"

          if [ "$status" = "200" ]; then
            echo "Access protection failed: anonymous health request returned 200"
            exit 1
          fi

          if [ "$status" != "302" ] && [ "$status" != "403" ]; then
            echo "Unexpected Access response status: $status"
            cat /tmp/access-headers.txt
            exit 1
          fi

          if [ "$status" = "302" ]; then
            grep -Eqi 'location:.*(cloudflareaccess\.com|/cdn-cgi/access/)' /tmp/access-headers.txt
          fi

      - name: Record deployed Worker endpoint
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: 'Bearer ' + token };

          const accountResponse = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/workers/subdomain',
            { headers },
          );
          const accountBody = await accountResponse.json();
          if (!accountResponse.ok || accountBody.success !== true || !accountBody.result?.subdomain) {
            throw new Error('Failed to read Workers account subdomain');
          }

          const scriptResponse = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/workers/scripts/come-back-home-runtime/subdomain',
            { headers },
          );
          const scriptBody = await scriptResponse.json();
          if (!scriptResponse.ok || scriptBody.success !== true) {
            throw new Error('Failed to read Worker script subdomain state');
          }

          const subdomain = accountBody.result.subdomain;
          const workersDevEnabled = scriptBody.result?.enabled === true;
          const previewUrlsEnabled = scriptBody.result?.previews_enabled === true;
          if (!workersDevEnabled) {
            throw new Error('Production workers.dev route must remain enabled before cutover');
          }
          if (previewUrlsEnabled) {
            throw new Error('Preview URLs must be disabled before replacement Worker verification');
          }
          const url = 'https://come-back-home-runtime.' + subdomain + '.workers.dev/';

          fs.mkdirSync('runtime-evidence', { recursive: true });
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          fs.writeFileSync(
            'runtime-evidence/cloudflare-worker-runtime.json',
            JSON.stringify({
              workerName: 'come-back-home-runtime',
              accountSubdomain: subdomain,
              workersDevEnabled,
              previewUrlsEnabled,
              url,
              clientRuntime: 'api',
              accessProtected: true,
              mutationsEnabled: config.vars?.MUTATIONS_ENABLED === '1',
              providerRuntimeEnabled: config.vars?.PROVIDER_RUNTIME_ENABLED === '1',
              pushDeliveryEnabled: config.vars?.PUSH_DELIVERY_ENABLED === '1',
              d1Binding: 'DB',
              cronConfigured: Array.isArray(config.triggers?.crons),
            }, null, 2) + '\n',
          );
          NODE

      - name: Verify remote Cron matches config
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
              '/workers/scripts/come-back-home-runtime/schedules',
            { headers: { Authorization: 'Bearer ' + token } },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true) {
            throw new Error('Failed to read Worker Cron schedules');
          }

          const rawSchedules = Array.isArray(body.result)
            ? body.result
            : Array.isArray(body.result?.schedules)
              ? body.result.schedules
              : null;
          if (!rawSchedules) {
            throw new Error('Unexpected Worker Cron schedule response shape');
          }

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const expectedCrons = [...(config.triggers?.crons ?? [])].sort();
          const actualCrons = rawSchedules
            .map((item) => item?.cron)
            .filter((value) => typeof value === 'string')
            .sort();

          if (JSON.stringify(actualCrons) !== JSON.stringify(expectedCrons)) {
            throw new Error(
              'Remote Cron mismatch: expected ' +
              JSON.stringify(expectedCrons) +
              ' but got ' +
              JSON.stringify(actualCrons),
            );
          }

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/cloudflare-cron-inventory.json',
            JSON.stringify({
              workerName: 'come-back-home-runtime',
              expectedCrons,
              actualCrons,
              matches: true,
              valuesExposed: false,
            }, null, 2) + '\n',
          );
          console.log('Remote Worker Cron matches wrangler config');
          NODE

      - name: Commit deployment evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/cloudflare-worker-runtime.json runtime-evidence/cloudflare-cron-inventory.json
          git diff --cached --quiet || git commit -m "chore: record parallel Worker deployment"
          git push
