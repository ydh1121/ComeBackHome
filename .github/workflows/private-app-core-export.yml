name: PRIVATE_APP_CORE_EXPORT_TEMP

on:
  push:
    branches:
      - "fix/p0-production-push-key-ocr-real-e2e"
    paths:
      - ".github/workflows/private-app-core-export.yml"

permissions:
  contents: read

jobs:
  export-app-core:
    name: TEMP / export source-equivalent private APP CORE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production API bundle
        run: npm run build
        env:
          VITE_CBH_RUNTIME: api
          VITE_CBH_PROVIDER_RUNTIME: api

      - name: Stage public APP CORE only
        shell: bash
        run: |
          set -euo pipefail
          LIMIT=104857600
          ROOT="$RUNNER_TEMP/cbh-private-app-core"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cp -a dist/. "$ROOT/"
          rm -rf "$ROOT/ocr" "$ROOT/ort"

          cat > "$ROOT/private-acceptance-server.mjs" <<'JS'
          import {createServer} from 'node:http';
          import {readFile,stat} from 'node:fs/promises';
          import {extname,join,normalize} from 'node:path';
          const root=process.cwd();
          const types={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8',
            '.mjs':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8',
            '.json':'application/json; charset=utf-8','.wasm':'application/wasm',
            '.onnx':'application/octet-stream','.gz':'application/gzip',
            '.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg',
            '.webmanifest':'application/manifest+json'};
          const safe=(url)=>{const p=normalize(decodeURIComponent((url||'/').split('?')[0]))
            .replace(/^[/\\]+/,'');return p.includes('..')?null:p};
          const server=createServer(async(req,res)=>{
            const rel=safe(req.url); if(rel===null){res.writeHead(400);res.end();return}
            let file=join(root,rel||'index.html');
            try{if((await stat(file)).isDirectory())file=join(file,'index.html')}catch{}
            try{const data=await readFile(file);
              res.setHeader('content-type',types[extname(file)]||'application/octet-stream');
              res.end(data);
            }catch{
              try{const data=await readFile(join(root,'index.html'));
                res.setHeader('content-type','text/html; charset=utf-8');res.end(data);
              }catch{res.writeHead(404);res.end('not found')}
            }
          });
          const port=Number(process.env.CBH_PRIVATE_PORT||4179);
          server.listen(port,'127.0.0.1',()=>console.log('CBH_PRIVATE_LOCAL_SERVER=http://127.0.0.1:'+port));
          JS

          export CBH_ROOT="$ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['CBH_ROOT'])
          files=[]; total=0
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes(); total+=len(b)
              files.append({'path':p.relative_to(root).as_posix(),'bytes':len(b),
                            'sha256':hashlib.sha256(b).hexdigest()})
          assert total < 104_857_600
          assert not any('/ocr/' in '/'+x['path'] or x['path'].startswith('ocr/') for x in files)
          assert not any('/ort/' in '/'+x['path'] or x['path'].startswith('ort/') for x in files)
          manifest={'kind':'CBH_PRIVATE_APP_CORE_PUBLIC_RUNTIME',
                    'sourceSha':os.environ['GITHUB_SHA'],
                    'privateImages':0,'bytes':total,'files':files}
          (root/'split-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('CBH_PRIVATE_APP_CORE_STAGE='+json.dumps({
            'sourceSha':os.environ['GITHUB_SHA'],'bytesBeforeManifest':total,
            'files':len(files),'privateImages':0},separators=(',',':')))
          PY
          bytes=$(du -sb "$ROOT" | cut -f1)
          test "$bytes" -lt "$LIMIT"
          echo "CBH_PRIVATE_APP_CORE_RAW_SIZE=$bytes"

      - name: Upload source-equivalent APP CORE
        uses: actions/upload-artifact@v4
        with:
          name: cbh-private-app-core-${{ github.sha }}
          path: ${{ runner.temp }}/cbh-private-app-core
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
