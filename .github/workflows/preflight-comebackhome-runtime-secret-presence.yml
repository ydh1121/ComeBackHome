name: Preflight ComeBackHome Runtime Secret Presence

on:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/preflight-comebackhome-runtime-secret-presence.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PRESENCE_EVENT_INGEST_TOKEN: ${{ secrets.PRESENCE_EVENT_INGEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write sanitized presence evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const names = [
            'KAKAO_REST_API_KEY',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY',
            'PRESENCE_EVENT_INGEST_TOKEN',
          ];

          const presence = Object.fromEntries(
            names.map((name) => [name, Boolean((process.env[name] ?? '').trim())]),
          );

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/github-runtime-secret-presence.json',
            JSON.stringify({ presence, valuesExposed: false }, null, 2) + '\n',
          );
          NODE

      - name: Commit sanitized evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/github-runtime-secret-presence.json
          git diff --cached --quiet || git commit -m "chore: record runtime secret presence"
          git push
