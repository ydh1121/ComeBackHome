name: PR94 owner-authorized production release
run-name: PR94 / backup and additive 0011 / owner approved 2026-10-19

# Owner explicitly approved production rollout. Read-only preflight first.
# migrate requires the durable, decrypted-and-rehearsed backup fingerprint.
on:
  push:
    branches: [feat/daily-life-and-multi-image-20261018, main]
    paths: [.github/workflows/release-pr94-production.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: cbh-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'ydh1121/ComeBackHome' && github.ref == 'refs/heads/feat/daily-life-and-multi-image-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_PHASE: preflight
      EXPECTED_CORE_SHA: ''
      BACKUP_DRIVE_ID: ''
      BACKUP_ENCRYPTED_SHA: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Wait for current-commit required CI before production migration
        if: env.RELEASE_PHASE == 'migrate'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const headers = { Authorization: 'Bearer ' + process.env.GITHUB_TOKEN, Accept: 'application/vnd.github+json' };
          const base = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
          for (let attempt = 0; attempt < 90; attempt++) {
            const response = await fetch(base + '/actions/runs?head_sha=' + process.env.GITHUB_SHA + '&event=pull_request&per_page=100', {headers});
            if (!response.ok) throw new Error('Cannot read required CI');
            const runs = (await response.json()).workflow_runs.filter(run => run.name === 'Phase 5G Local Integration');
            const run = runs.sort((a,b) => b.id-a.id)[0];
            if (run?.status === 'completed') {
              if (run.conclusion !== 'success') throw new Error('Required CI did not pass: ' + run.conclusion);
              const jobsResponse = await fetch(base + '/actions/runs/' + run.id + '/jobs?per_page=100', {headers});
              if (!jobsResponse.ok) throw new Error('Cannot verify required jobs');
              const jobs = (await jobsResponse.json()).jobs;
              if (jobs.filter(job => job.conclusion === 'success').length !== 12 || jobs.some(job => !['success','skipped'].includes(job.conclusion))) throw new Error('Required job acceptance mismatch');
              console.log(JSON.stringify({requiredRun:run.id,requiredSuccess:12,head:process.env.GITHUB_SHA}));
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 20000));
          }
          throw new Error('Timed out waiting for required CI; no production migration executed');
          NODE
      - name: Run guarded release phase
        run: node scripts/release-pr94-production.mjs "$RELEASE_PHASE"
      - uses: actions/upload-artifact@v4
        with:
          name: cbh-pr94-release-${{ env.RELEASE_PHASE }}
          path: runtime-evidence/pr94-release/
          retention-days: 1
          if-no-files-found: error
  verify-schema:
    if: github.repository == 'ydh1121/ComeBackHome' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Wait for exact canonical commit
        run: |
          node --input-type=module <<'NODE'
          for(let i=0;i<90;i++) {
            const response=await fetch('https://come-back-home.pages.dev/api/health',{cache:'no-store'}).catch(()=>null);
            const health=await response?.json().catch(()=>null);
            if(response?.ok && health?.ok === true && health.commitSha === process.env.GITHUB_SHA) process.exit(0);
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw new Error('Canonical commit not deployed');
          NODE
      - name: Verify canonical D1 schema and unchanged scheduler
        run: node scripts/release-pr94-production.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: cbh-pr94-production-schema
          path: runtime-evidence/pr94-release/verify.json
          retention-days: 7
          if-no-files-found: error
