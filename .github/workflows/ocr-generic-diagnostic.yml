name: GENERIC_OCR_DIAGNOSTIC / NON-BLOCKING PRODUCT POLICY

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/p0-production-push-key-ocr-real-e2e"
    paths:
      - ".github/workflows/ocr-generic-diagnostic.yml"
      - "package.json"
      - "src/providers/import/**"
      - "scripts/prepare-ocr-assets.mjs"
      - "scripts/verify-ocr-real-tesseract-e2e.mjs"
      - "scripts/verify-ocr-detected-engine-comparison.mjs"
      - "tools/ocr-eval/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ocr-generic-diagnostic.yml"
      - "package.json"
      - "src/providers/import/**"
      - "scripts/prepare-ocr-assets.mjs"
      - "scripts/verify-ocr-real-tesseract-e2e.mjs"
      - "scripts/verify-ocr-detected-engine-comparison.mjs"
      - "tools/ocr-eval/**"

permissions:
  contents: read

concurrency:
  group: cbh-generic-ocr-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generic-tesseract-4-6d:
    name: GENERIC_OCR_DIAGNOSTIC / 4-6d Tesseract / expected real FAIL preserved
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Playwright JS package
        run: npm install --no-save --no-package-lock playwright@1.58.2

      - name: Prepare local Tesseract assets
        run: npm run prepare:ocr-assets

      - name: Install and pin realistic Korean test font
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if ! fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum; then
            timeout 360s bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends fonts-nanum'
            fc-cache -f
          fi
          fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum

      - name: Declare approved diagnostic classification
        run: |
          echo "CBH_GATE_CLASS=GENERIC_OCR_DIAGNOSTIC"
          echo "CBH_GATE_BLOCKING=false"
          echo "CBH_DIAGNOSTIC_SCOPE=GENERATED_4_5_6_DAY_TESSERACT"
          echo "CBH_DIAGNOSTIC_POLICY=D-CBH-20261009-OCR-GATE-C-DISPOSITION-001"
          echo "Measured failures remain failures; no threshold change or continue-on-error."

      - name: Run unchanged generic 4-6d real Tesseract quality diagnostic
        run: npm run verify:ocr-real-tesseract-e2e

  generic-structurefirst-matrix:
    name: GENERIC_OCR_DIAGNOSTIC / 5-6d StructureFirst multi-engine / expected real FAIL preserved
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python for verified Korean ONNX assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser OCR benchmark runtime
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2 onnxruntime-web@1.23.2

      - name: Install pinned Korean test glyph font
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if ! fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum; then
            timeout 360s bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends fonts-nanum'
            fc-cache -f
          fi
          fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum

      - name: Download official verified Korean ONNX and compile actual CTC dictionary
        run: |
          python -m pip install --no-cache-dir "huggingface_hub>=0.35,<2" "PyYAML>=6,<7"
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import hashlib, json, pathlib, shutil, yaml
          repo='PaddlePaddle/korean_PP-OCRv5_mobile_rec_onnx'
          path=pathlib.Path('public/ocr-paddle-probe')
          path.mkdir(parents=True,exist_ok=True)
          onnx=pathlib.Path(hf_hub_download(repo_id=repo,filename='inference.onnx'))
          yaml_file=pathlib.Path(hf_hub_download(repo_id=repo,filename='inference.yml'))
          digest=hashlib.sha256(onnx.read_bytes()).hexdigest()
          assert digest=='92f0b7785e64fc9090106a241cf4c1eb97472824558272751b88a2a4476d3a08'
          config=yaml.safe_load(yaml_file.read_text())
          assert config['Global']['model_name']=='korean_PP-OCRv5_mobile_rec'
          alphabet=config['PostProcess']['character_dict']
          assert alphabet and '강' in alphabet and '0' in alphabet and ' ' not in alphabet
          alphabet=[*alphabet,' ']
          shutil.copyfile(onnx,path/'inference.onnx')
          (path/'dict.json').write_text(json.dumps(alphabet,ensure_ascii=False))
          ort=pathlib.Path('node_modules/onnxruntime-web/dist')
          dest=pathlib.Path('public/ort')
          dest.mkdir(parents=True,exist_ok=True)
          for item in ort.glob('ort-wasm*'):
            if item.suffix in ('.wasm','.mjs'):
              shutil.copyfile(item,dest/item.name)
          print('CBH_GENERIC_DIAGNOSTIC_ONNX_SHA256='+digest)
          PY

      - name: Prepare local Tesseract assets
        run: npm run prepare:ocr-assets

      - name: Declare approved diagnostic classification
        run: |
          echo "CBH_GATE_CLASS=GENERIC_OCR_DIAGNOSTIC"
          echo "CBH_GATE_BLOCKING=false"
          echo "CBH_DIAGNOSTIC_SCOPE=GENERATED_5_6_DAY_STRUCTUREFIRST_TESSERACT_PADDLE_H1_H2_H3"
          echo "CBH_DIAGNOSTIC_POLICY=D-CBH-20261009-OCR-GATE-C-DISPOSITION-001"
          echo "Measured failures remain failures; no threshold change or continue-on-error."

      - name: Run unchanged generic StructureFirst Tesseract Paddle Hybrid diagnostic
        run: node scripts/verify-ocr-detected-engine-comparison.mjs
