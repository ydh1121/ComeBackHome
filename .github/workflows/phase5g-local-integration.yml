name: Phase 5G Local Integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase5g-local-integration.yml"
      - "wrangler.local.jsonc"
      - "package.json"
      - "db/migrations/**"
      - "worker/**"
      - "src/app/**"
      - "src/config/runtime.ts"
      - "src/application/contracts/**"
      - "src/providers/http/**"
      - "scripts/verify-phase5g-local*.mjs"
      - "scripts/verify-phase5h-*.mjs"
      - "scripts/verify-phase5i-*.mjs"
      - "scripts/verify-phase5j-*.mjs"
      - "scripts/verify-phase5k-*.mjs"
      - "scripts/verify-phase5l-*.mjs"
      - "scripts/verify-phase5m-*.mjs"
      - "scripts/verify-phase5n-*.mjs"
      - "scripts/verify-phase5o-*.mjs"
      - "scripts/verify-phase5p-*.mjs"
      - "src/providers/import/**"
      - "src/application/services/WorkbookImportFileSelectionAction.ts"
      - "src/application/use-cases/commitImportReview.ts"
      - "src/mocks/repositories.ts"
      - "test/fixtures/import/**"
      - "test/fixtures/providers/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase5g-local-integration.yml"
      - "wrangler.local.jsonc"
      - "package.json"
      - "db/migrations/**"
      - "worker/**"
      - "src/app/**"
      - "src/config/runtime.ts"
      - "src/providers/http/**"
      - "scripts/verify-phase5g-local*.mjs"
      - "scripts/verify-phase5h-*.mjs"
      - "scripts/verify-phase5i-*.mjs"
      - "scripts/verify-phase5j-*.mjs"
      - "scripts/verify-phase5k-*.mjs"
      - "scripts/verify-phase5l-*.mjs"
      - "scripts/verify-phase5m-*.mjs"
      - "scripts/verify-phase5n-*.mjs"
      - "scripts/verify-phase5o-*.mjs"
      - "scripts/verify-phase5p-*.mjs"
      - "src/providers/import/**"
      - "src/application/services/WorkbookImportFileSelectionAction.ts"
      - "src/application/use-cases/commitImportReview.ts"
      - "src/mocks/repositories.ts"
      - "test/fixtures/import/**"
      - "test/fixtures/providers/**"

permissions:
  contents: read

jobs:
  phase5g-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Verify local-only contract
        run: npm run verify:local-contract

      - name: Verify provider boundary
        run: npm run verify:provider-boundary

      - name: Verify provider feasibility
        run: npm run verify:provider-feasibility

      - name: Verify provider mappers
        run: npm run verify:provider-mappers

      - name: Verify provider clients
        run: npm run verify:provider-clients

      - name: Verify provider security
        run: npm run verify:provider-security

      - name: Verify Kakao transport
        run: npm run verify:kakao-transport

      - name: Verify provider runtime
        run: npm run verify:provider-runtime

      - name: Verify provider E2E
        run: npm run verify:provider-e2e

      - name: Verify import workflow
        run: npm run verify:import

      - name: Verify hybrid HTTP runtime
        run: npm run verify:http-runtime

      - name: Verify workbook import parser
        run: npm run verify:import-parser

      - name: Run Phase 5G local integration
        run: npm run verify:local-integration
