permissions:
  contents: write

concurrency:
  group: cbh-phase5g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5g-local:
    name: PRODUCT_REQUIRED_GATE / full product + shared safety local integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck shared server code
        run: npm run typecheck:worker

      - name: Build Pages Functions bundle
        run: npx wrangler pages functions build functions --outdir .tmp-pages-functions --compatibility-date 2026-10-06 --compatibility-flags nodejs_compat

      - name: Verify local-only contract
        run: npm run verify:local-contract

      - name: Verify provider boundary
        run: npm run verify:provider-boundary

      - name: Verify provider feasibility
        run: npm run verify:provider-feasibility

      - name: Verify provider mappers
        run: npm run verify:provider-mappers

      - name: Verify provider clients
        run: npm run verify:provider-clients

      - name: Verify provider security
        run: npm run verify:provider-security

      - name: Verify Kakao transport
        run: npm run verify:kakao-transport

      - name: Verify provider runtime
        run: npm run verify:provider-runtime

      - name: Verify provider E2E
        run: npm run verify:provider-e2e

      - name: Enforce zero live Kakao routes in standard CI
        run: npm run verify:route-firewall

      - name: Confirm reversible D1 QA readiness without any writes
        run: npm run verify:d1-readiness

      - name: Verify schedule workflow
        run: npm run verify:schedule

      - name: Verify import workflow
        run: npm run verify:import

      - name: Verify hybrid HTTP runtime
        run: npm run verify:http-runtime

      - name: Verify workbook import parser
        run: npm run verify:import-parser

      - name: Verify explicit import review
        run: npm run verify:import-review

      - name: Verify push boundary
        run: npm run verify:push

      - name: Verify push client boundary
        run: npm run verify:push-client

      - name: Verify browser push wiring
        run: npm run verify:push-wiring

      - name: Verify Web Push gateway
        run: npm run verify:web-push-gateway

      - name: Verify independent test push readiness and reconnection without external sends
        run: npm run verify:push-recovery

      - name: Verify server/client runtime VAPID public key parity
        run: npm run verify:push-runtime-key

      - name: Verify VAPID P-256 pair self-check
        run: npm run verify:vapid-pair

      - name: Verify production service worker push/click handlers without external push
        run: npm run verify:push-sw-local

      - name: Verify notification ETA source
        run: npm run verify:notification-eta-source

      - name: Verify notification retry policy
        run: npm run verify:notification-retry-policy

      - name: Verify notification activation readiness
        run: npm run verify:notification-activation-readiness

      - name: Verify notification activation preflight
        run: npm run verify:notification-activation-preflight

      - name: Verify Cloudflare environment contract
        run: npm run verify:cloudflare-env-contract

      - name: Verify canonical Pages runtime config
        run: npm run verify:worker-migration-config

      - name: Verify staging mutation gate
        run: npm run verify:staging-mutation-gate

      - name: Verify trusted presence-event ingestion
        run: npm run verify:presence-event-ingest

      - name: Verify backend architecture
        run: npm run verify:backend

      - name: Verify Pages server adapters
        run: npm run verify:worker

      - name: Verify notification outbox
        run: npm run verify:notification-outbox

      - name: Verify notification planner
        run: npm run verify:notification-planner

      - name: Verify scheduled notification composition
        run: npm run verify:scheduled-notification

      - name: Verify image schedule layout
        run: npm run verify:image-layout

      - name: Verify OCR adapter
        run: npm run verify:ocr-adapter

      - name: Verify weekly 7x3 adapter and fail-closed synthetic contract
        run: node scripts/verify-ocr-weekly-3col-adapter-unit.mjs

      - name: Verify actual product Paddle wiring and break-minute source contract
        run: node scripts/verify-ocr-product-static-contract.mjs

      - name: Verify OCR runtime assets
        run: npm run verify:ocr-assets

      - name: Verify OCR local distribution
        run: npm run verify:ocr-distribution

      - name: Verify private OCR evaluation harness
        run: npm run verify:ocr-eval-harness

      - name: Verify OCR calendar reconstruction
        run: npm run verify:ocr-calendar-reconstruction

      - name: Verify OCR half-hour recovery
        run: npm run verify:ocr-half-hour-recovery

      - name: Verify schedule image pattern refinement
        run: npm run verify:ocr-pattern-refinement

      - name: Verify structure-first raster schedule recognition
        run: npm run verify:ocr-structure-first

      - name: Evaluate generated A/B/C OCR raster matrix corpus without user images
        run: npm run verify:ocr-generated-corpus

      - name: Verify vertically stacked and side-by-side cell time order
        run: npm run verify:ocr-region-order

      - name: Prepare real Tesseract browser runtime (temporary CI workspace)
        run: npm run prepare:ocr-assets

      - name: Verify image-derived partial grid column geometry
        run: npm run verify:ocr-partial-grid

      - name: Verify local D1 notification E2E
        run: npm run verify:notification-d1-e2e

      - name: Run full product check
        run: npm run check

      - name: Build production API bundle
        run: npm run build
        env:
          VITE_CBH_RUNTIME: api
          VITE_CBH_PROVIDER_RUNTIME: api

      - name: Verify production bundle cleanliness
        run: npm run verify:production-bundle

      - name: Run Phase 5G local integration
        run: npm run verify:local-integration

  ocr-real-tesseract:
    # Blocking B gate only: actual weekly header/Tesseract lifecycle and
    # weekly 7x3 physical browser safety. Generic 4/5/6-day quality moved
    # unchanged to the separate GENERIC_OCR_DIAGNOSTIC workflow by
    # D-CBH-20261009-OCR-GATE-C-DISPOSITION-001.
    name: SHARED_SAFETY_GATE / weekly Tesseract + 7x3 physical / Chromium + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Image includes browser binaries and host libraries; no slow apt install-deps.
    # Pinned to the tested Playwright package version (not a floating latest).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Playwright JS package (CI only)
        run: npm install --no-save --no-package-lock playwright@1.58.2

      - name: Prepare local Tesseract assets
        run: npm run prepare:ocr-assets

      - name: Install and pin realistic Korean test font
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Unifont-JP satisfies fc-list :lang=ko but produces different Korean
          # training pixels than a real Nanum font. Fail closed if unavailable.
          if ! fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum; then
            timeout 360s bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends fonts-nanum'
            fc-cache -f
          fi
          fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum
          fc-match -f '%{family}\n' 'Nanum Gothic:lang=ko'

      - name: Declare shared-safety gate class
        run: |
          echo "CBH_GATE_CLASS=SHARED_SAFETY_GATE"
          echo "CBH_GATE_BLOCKING=true"
          echo "CBH_GENERIC_4_5_6_DAY_SCOPE=SEPARATE_DIAGNOSTIC_WORKFLOW"

      - name: Verify image-derived partial grid column geometry
        run: npm run verify:ocr-partial-grid

      - name: Verify weekly 7x3 physical roster in Chromium and WebKit
        run: node scripts/verify-ocr-weekly-3col-physical.mjs

  ocr-paddle-official-oracle:
    name: Official Korean Paddle vs Tesseract / generated ORACLE
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 81
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - name: Checkout isolated OCR Draft
        uses: actions/checkout@v4

      - name: Setup Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Korean raster font and Tesseract engine
        run: |
          export DEBIAN_FRONTEND=noninteractive
          timeout 360s sudo apt-get update -qq
          timeout 360s sudo apt-get install -y --no-install-recommends fonts-nanum tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          tesseract --version | head -1
          fc-match -f '%{family}\n' 'Nanum Gothic:lang=ko'

      - name: Install official Paddle inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary "paddlepaddle>=3.2,<4" "paddleocr>=3.2,<4" "Pillow>=11,<13"
          python -m pip show paddlepaddle paddleocr Pillow

      - name: Run TRUE Korean model inference on identical generated glyph inputs
        run: timeout 1500s python -u scripts/ocr-korean-paddle-probe.py

  ocr-paddle-official-onnx-browser:
    name: PRODUCT_REQUIRED_GATE / weekly 7x3 Paddle / real Chromium + WebKit WASM
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 81) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/p0-production-push-key-ocr-real-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout isolated OCR Draft
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python for official model fetch and YAML parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS browser OCR benchmark runtime
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2 onnxruntime-web@1.23.2

      - name: Install pinned Korean test glyph font
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if ! fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum; then
            timeout 360s bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends fonts-nanum'
            fc-cache -f
          fi
          fc-match -f '%{family}' 'Nanum Gothic:lang=ko' | grep -qi Nanum

      - name: Download official verified Korean ONNX and compile actual CTC dictionary
        run: |
          python -m pip install --no-cache-dir "huggingface_hub>=0.35,<2" "PyYAML>=6,<7"
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import hashlib, json, pathlib, shutil, yaml
          repo='PaddlePaddle/korean_PP-OCRv5_mobile_rec_onnx'
          path=pathlib.Path('public/ocr-paddle-probe')
          path.mkdir(parents=True,exist_ok=True)
          onnx=pathlib.Path(hf_hub_download(repo_id=repo,filename='inference.onnx'))
          yaml_file=pathlib.Path(hf_hub_download(repo_id=repo,filename='inference.yml'))
          digest=hashlib.sha256(onnx.read_bytes()).hexdigest()
          assert digest=='92f0b7785e64fc9090106a241cf4c1eb97472824558272751b88a2a4476d3a08', 'Official model hash mismatch'
          config=yaml.safe_load(yaml_file.read_text())
          assert config['Global']['model_name']=='korean_PP-OCRv5_mobile_rec'
          assert config['PostProcess']['name']=='CTCLabelDecode'
          alphabet=config['PostProcess']['character_dict']
          assert alphabet and '강' in alphabet and '0' in alphabet
          # Official PP-OCRv5 CTC mapping: blank index 0, explicit
          # dictionary characters, then one train-time space class.
          # The verified ONNX logits contain 11947 classes for 11945
          # dictionary characters; retain the official space token.
          assert ' ' not in alphabet
          alphabet=[*alphabet,' ']
          shutil.copyfile(onnx,path/'inference.onnx')
          (path/'dict.json').write_text(json.dumps(alphabet,ensure_ascii=False))
          print('CBH_OFFICIAL_ONNX_SHA256='+digest)
          print('CBH_OFFICIAL_ONNX_MODEL_BYTES='+str(onnx.stat().st_size))
          print('CBH_OFFICIAL_ONNX_DICTIONARY_CHARS='+str(len(alphabet)))
          ort=pathlib.Path('node_modules/onnxruntime-web/dist')
          dest=pathlib.Path('public/ort')
          dest.mkdir(parents=True,exist_ok=True)
          for item in ort.glob('ort-wasm*'):
            if item.suffix in ('.wasm','.mjs'):
              shutil.copyfile(item,dest/item.name)
          for item in dest.glob('*'):
            print('ORT_ASSET='+item.name+' BYTES='+str(item.stat().st_size))
          PY

      - name: Run official ONNX CPU WASM in real Chromium and WebKit
        run: node scripts/verify-ocr-paddle-onnx-browser.mjs

      - name: Reuse installed packages to prepare local Tesseract browser assets
        run: npm run prepare:ocr-assets

      - name: Stage verified Korean ONNX, dictionary and WASM for same-origin product adapter
        run: node scripts/stage-weekly-paddle-assets.mjs

      - name: Verify installed ONNX dependency and build actual product bundle
        run: |
          npm ls onnxruntime-web@1.23.2 --depth=0
          npm run build

      - name: Verify built product bundle and pinned same-origin runtime assets
        run: node scripts/verify-ocr-built-assets.mjs

      - name: Verify actual app weekly Paddle through loopback HTTP and isolated D1 in Chromium and WebKit
        run: CBH_OCR_REAL_HTTP_D1_FOCUSED=1 node scripts/verify-ocr-weekly-3col-real.mjs
        timeout-minutes: 8

      - name: Compare real weekly 7x3 Tesseract and Paddle on identical detected crops
        run: node scripts/verify-ocr-weekly-3col-real.mjs
        timeout-minutes: 12

      - name: Declare product-required gate class
        run: |
          echo "CBH_GATE_CLASS=PRODUCT_REQUIRED_GATE"
          echo "CBH_GATE_BLOCKING=true"
          echo "CBH_GENERIC_STRUCTUREFIRST_SCOPE=SEPARATE_DIAGNOSTIC_WORKFLOW"

      # PR-only bootstrap contains public repository/runtime dependencies only.
      # Private roster images are never uploaded to Actions or stored in this artifact.
      - name: Package private-local acceptance runtime bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/p0-production-push-key-ocr-real-e2e'
        run: |
          tar --exclude=.git --exclude=.wrangler --exclude=.tmp --exclude=.tmp-pages-functions \
            -czf /tmp/cbh-private-runtime-bootstrap.tgz .

      - name: Upload private-local acceptance runtime bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/p0-production-push-key-ocr-real-e2e'
        uses: actions/upload-artifact@v4
        with:
          name: cbh-private-runtime-bootstrap-${{ github.sha }}
          path: /tmp/cbh-private-runtime-bootstrap.tgz
          retention-days: 1
          if-no-files-found: error
