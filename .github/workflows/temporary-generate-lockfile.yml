name: TEMP / generate deterministic npm dependency lockfile

on:
  push:
    branches: [fix/canonical-ocr-runtime-assets]
    paths:
      - ".github/workflows/temporary-generate-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile from existing package without running product code
        run: |
          test ! -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          node -e "const p=require('./package-lock.json');const j=require('./package.json');if(p.lockfileVersion<3||p.packages[''].dependencies['onnxruntime-web']!==j.dependencies['onnxruntime-web'])process.exit(1)"
      - name: Commit generated lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "build: lock pinned packages for clean production npm ci"
          git push origin "HEAD:fix/canonical-ocr-runtime-assets"
