name: Inventory Reusable Cloudflare Access

on:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/inventory-cloudflare-access.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inventory Access apps without identity selectors
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare credentials missing');

          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/access/apps',
            { headers: { Authorization: 'Bearer ' + token } },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true) {
            throw new Error('Failed to list Cloudflare Access applications');
          }

          const apps = (body.result ?? [])
            .filter((app) => {
              const haystack = String(app.name ?? '') + ' ' + String(app.domain ?? '');
              return /hoooo|come-back-home/i.test(haystack);
            })
            .map((app) => ({
              id: app.id ?? null,
              name: app.name ?? null,
              domain: app.domain ?? null,
              type: app.type ?? null,
              policyCount: Array.isArray(app.policies) ? app.policies.length : 0,
              policies: Array.isArray(app.policies)
                ? app.policies.map((policy) => ({
                    id: typeof policy === 'string' ? policy : policy?.id ?? null,
                    name: typeof policy === 'object' ? policy?.name ?? null : null,
                    decision: typeof policy === 'object' ? policy?.decision ?? null : null,
                    precedence: typeof policy === 'object' ? policy?.precedence ?? null : null,
                  }))
                : [],
            }));

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/cloudflare-access-inventory.json',
            JSON.stringify({ matchedApps: apps }, null, 2) + '\n',
          );
          NODE

      - name: Commit sanitized Access evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/cloudflare-access-inventory.json
          git diff --cached --quiet || git commit -m "chore: record sanitized Access inventory"
          git push
