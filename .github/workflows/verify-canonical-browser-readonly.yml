name: Canonical Browser Read-Only QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-canonical-browser-readonly.yml"
      - "scripts/verify-canonical-browser-readonly.mjs"
      - "runtime-activation/pages-browser-qa.trigger"

permissions:
  contents: read

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install ephemeral browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify production browser flows without mutating user data
        run: node scripts/verify-canonical-browser-readonly.mjs
      - name: Preserve private layout-crop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbh-active-transit-card-layout
          path: artifacts/cbh-transit-card/*.png
          if-no-files-found: ignore
          retention-days: 7
