name: Sync ComeBackHome Runtime Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - "runtime-activation/secret-sync.trigger"

permissions:
  contents: write

concurrency:
  group: comebackhome-runtime-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PRESENCE_EVENT_INGEST_TOKEN: ${{ secrets.PRESENCE_EVENT_INGEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required secret presence without values
        shell: bash
        run: |
          missing=0
          for name in KAKAO_REST_API_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY PRESENCE_EVENT_INGEST_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "MISSING: $name"
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Validate VAPID public key shape
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.VAPID_PUBLIC_KEY ?? '';
          if (!/^[A-Za-z0-9_-]{80,100}$/.test(value)) {
            throw new Error('VAPID_PUBLIC_KEY shape is invalid');
          }
          if (!(process.env.VAPID_PRIVATE_KEY ?? '').trim()) {
            throw new Error('VAPID_PRIVATE_KEY missing');
          }
          NODE

      - name: Sync server-only secrets to Worker
        shell: bash
        run: |
          printf '%s' "$KAKAO_REST_API_KEY" | npx wrangler secret put KAKAO_REST_API_KEY --name come-back-home-runtime
          printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY --name come-back-home-runtime
          printf '%s' "$PRESENCE_EVENT_INGEST_TOKEN" | npx wrangler secret put PRESENCE_EVENT_INGEST_TOKEN --name come-back-home-runtime

      - name: Persist public activation config
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.vars = {
            ...(config.vars ?? {}),
            VAPID_PUBLIC_KEY: process.env.VAPID_PUBLIC_KEY,
            VAPID_SUBJECT: 'https://come-back-home-runtime.ydh1121.workers.dev/',
            WEB_PUSH_TTL_SECONDS: '300',
            NOTIFICATION_RETRY_DELAYS_SECONDS: '30,90,300',
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Verify Worker secret names only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/workers/scripts/come-back-home-runtime/secrets',
            { headers: { Authorization: 'Bearer ' + token } },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true) {
            throw new Error('Failed to list Worker secret names after sync');
          }
          const names = (body.result ?? [])
            .map((item) => item?.name)
            .filter((name) => typeof name === 'string')
            .sort();
          for (const required of [
            'KAKAO_REST_API_KEY',
            'PRESENCE_EVENT_INGEST_TOKEN',
            'VAPID_PRIVATE_KEY',
          ]) {
            if (!names.includes(required)) {
              throw new Error('Worker secret missing after sync: ' + required);
            }
          }
          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/cloudflare-worker-secret-inventory.json',
            JSON.stringify({
              workerName: 'come-back-home-runtime',
              secretNames: names,
              valuesExposed: false,
            }, null, 2) + '\n',
          );
          NODE

      - name: Commit public config and sanitized evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc runtime-evidence/cloudflare-worker-secret-inventory.json
          git diff --cached --quiet || git commit -m "chore: sync runtime secret metadata"
          git push
