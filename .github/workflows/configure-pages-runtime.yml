name: Configure Pages Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/configure-pages-runtime.yml"
      - "functions/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: comebackhome-pages-runtime-config
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      SEOUL_BUS_SERVICE_KEY: ${{ secrets.SEOUL_BUS_SERVICE_KEY }}
      SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PRESENCE_EVENT_INGEST_TOKEN: ${{ secrets.PRESENCE_EVENT_INGEST_TOKEN }}
      VAPID_PUBLIC_KEY_SECRET: ${{ secrets.VAPID_PUBLIC_KEY }}
      PAGES_ORIGIN: https://come-back-home.pages.dev
      PAGES_PROJECT: come-back-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify credentials and runtime secrets
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KAKAO_REST_API_KEY VAPID_PRIVATE_KEY PRESENCE_EVENT_INGEST_TOKEN; do
            test -n "${!name}"
          done

      - name: Configure Pages as the only application runtime
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.PAGES_PROJECT;
          const projectUrl =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/' + projectName;
          const authHeaders = { Authorization: 'Bearer ' + token };

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'come-back-home' || config.pages_build_output_dir !== './dist') {
            throw new Error('Canonical Pages Wrangler config is invalid');
          }
          const db = config.d1_databases?.find((item) => item.binding === 'DB');
          if (!db?.database_id) throw new Error('Canonical Pages D1 binding is missing');

          const publicKey =
            (process.env.VAPID_PUBLIC_KEY_SECRET ?? '').trim() ||
            (config.vars?.VAPID_PUBLIC_KEY ?? '').trim();
          if (!/^[A-Za-z0-9_-]{80,100}$/.test(publicKey)) {
            throw new Error('VAPID public key is unavailable');
          }

          const runtimeEnv = {
            VITE_CBH_RUNTIME: { type: 'plain_text', value: 'api' },
            VITE_CBH_PROVIDER_RUNTIME: { type: 'plain_text', value: 'api' },
            VITE_CBH_VAPID_PUBLIC_KEY: { type: 'plain_text', value: publicKey },
            MUTATIONS_ENABLED: { type: 'plain_text', value: '1' },
            PROVIDER_RUNTIME_ENABLED: { type: 'plain_text', value: '1' },
            PUSH_DELIVERY_ENABLED: { type: 'plain_text', value: '1' },
            VAPID_PUBLIC_KEY: { type: 'plain_text', value: publicKey },
            VAPID_SUBJECT: { type: 'plain_text', value: 'https://come-back-home.pages.dev/' },
            WEB_PUSH_TTL_SECONDS: { type: 'plain_text', value: '300' },
            NOTIFICATION_RETRY_DELAYS_SECONDS: { type: 'plain_text', value: '30,90,300' },
            KAKAO_REST_API_KEY: { type: 'secret_text', value: process.env.KAKAO_REST_API_KEY },
            ...((process.env.SEOUL_BUS_SERVICE_KEY ?? '').trim() ? {
              SEOUL_BUS_SERVICE_KEY: { type: 'secret_text', value: process.env.SEOUL_BUS_SERVICE_KEY },
            } : {}),
            ...((process.env.SEOUL_SUBWAY_API_KEY ?? '').trim() ? {
              SEOUL_SUBWAY_API_KEY: { type: 'secret_text', value: process.env.SEOUL_SUBWAY_API_KEY },
            } : {}),
            VAPID_PRIVATE_KEY: { type: 'secret_text', value: process.env.VAPID_PRIVATE_KEY },
            PRESENCE_EVENT_INGEST_TOKEN: { type: 'secret_text', value: process.env.PRESENCE_EVENT_INGEST_TOKEN },
          };

          const directPagesConfig = {
            env_vars: runtimeEnv,
            d1_databases: {
              DB: { id: db.database_id },
            },
            services: { CBH_RUNTIME: null },
            compatibility_flags: ['nodejs_compat'],
          };

          const patchResponse = await fetch(projectUrl, {
            method: 'PATCH',
            headers: {
              ...authHeaders,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              build_config: {
                build_command: 'npm run build',
                destination_dir: 'dist',
                root_dir: '/',
              },
              source: {
                config: {
                  production_deployments_enabled: true,
                  preview_deployment_setting: 'none',
                },
              },
              deployment_configs: {
                production: directPagesConfig,
                preview: directPagesConfig,
              },
            }),
          });
          const patchBody = await patchResponse.json();
          if (!patchResponse.ok || patchBody.success !== true) {
            throw new Error('Failed to configure canonical Pages runtime');
          }

          const readbackResponse = await fetch(projectUrl, { headers: authHeaders });
          const readbackBody = await readbackResponse.json();
          if (!readbackResponse.ok || readbackBody.success !== true) {
            throw new Error('Failed to read back canonical Pages runtime');
          }

          const project = readbackBody.result;
          const production = project?.deployment_configs?.production ?? {};
          const source = project?.source?.config ?? {};
          if (source.production_deployments_enabled !== true) {
            throw new Error('Pages production deployment is not enabled');
          }
          if (source.preview_deployment_setting !== 'none') {
            throw new Error('Pages preview deployments must remain disabled');
          }
          if (production.d1_databases?.DB?.id !== db.database_id) {
            throw new Error('Pages DB binding readback mismatch');
          }
          if (production.services?.CBH_RUNTIME) {
            throw new Error('Obsolete CBH_RUNTIME service binding still exists');
          }
          for (const name of [
            'KAKAO_REST_API_KEY',
            'VAPID_PRIVATE_KEY',
            'PRESENCE_EVENT_INGEST_TOKEN',
          ]) {
            if (!production.env_vars?.[name]) {
              throw new Error('Pages secret binding missing: ' + name);
            }
          }

          console.log(JSON.stringify({
            canonicalRuntime: 'pages',
            canonicalOrigin: process.env.PAGES_ORIGIN,
            realtimeProviderBindings: {
              seoulBus: Boolean(production.env_vars?.SEOUL_BUS_SERVICE_KEY),
              seoulSubway: Boolean(production.env_vars?.SEOUL_SUBWAY_API_KEY),
            },
            d1BoundDirectly: true,
            providerSecretsBoundDirectly: true,
            pushSecretsBoundDirectly: true,
            serviceBindingPresent: false,
            previewDeployments: 'none',
            valuesExposed: false,
          }));
          NODE

      - name: Resolve or trigger production Pages deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.PAGES_PROJECT;
          const sourceCommit = process.env.GITHUB_SHA ?? '';
          const deployUrl =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/' + projectName + '/deployments';
          const authHeaders = { Authorization: 'Bearer ' + token };

          const listUrl = new URL(deployUrl);
          listUrl.searchParams.set('env', 'production');
          listUrl.searchParams.set('per_page', '20');
          const listResponse = await fetch(listUrl, { headers: authHeaders });
          const listBody = await listResponse.json();
          if (!listResponse.ok || listBody.success !== true) {
            throw new Error('Failed to list Pages deployments');
          }

          const deployments = Array.isArray(listBody.result) ? listBody.result : [];
          let deployment = deployments.find(
            (item) => item?.deployment_trigger?.metadata?.commit_hash === sourceCommit,
          ) ?? null;

          if (!deployment) {
            const form = new FormData();
            form.set('branch', 'main');
            form.set('commit_hash', sourceCommit);
            form.set('commit_dirty', 'false');
            form.set('commit_message', 'Deploy canonical Pages runtime');

            const response = await fetch(deployUrl, {
              method: 'POST',
              headers: authHeaders,
              body: form,
            });
            const body = await response.json();
            if (!response.ok || body?.success !== true || !body?.result?.id) {
              throw new Error('Failed to trigger Pages deployment');
            }
            deployment = body.result;
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            'PAGES_DEPLOYMENT_ID=' + deployment.id + '\n',
          );
          NODE

      - name: Wait for Pages production deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const deploymentId = process.env.PAGES_DEPLOYMENT_ID;
          const url =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/come-back-home/deployments/' + deploymentId;

          for (let attempt = 0; attempt < 60; attempt += 1) {
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + token },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              throw new Error('Failed to read Pages deployment');
            }
            const deployment = body.result;
            const stage =
              deployment?.latest_stage?.status ??
              deployment?.stages?.find((item) => item?.name === 'deploy')?.status ??
              deployment?.stages?.at(-1)?.status ??
              'unknown';
            if (stage === 'success') {
              if (deployment?.uses_functions !== true) {
                throw new Error('Pages deployment does not include Functions');
              }
              process.exit(0);
            }
            if (['failure', 'canceled', 'skipped'].includes(stage)) {
              throw new Error('Pages deployment ended with status ' + stage);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error('Timed out waiting for Pages deployment');
          NODE

      - name: Verify canonical Pages API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.PAGES_ORIGIN;

          const root = await fetch(origin + '/');
          if (!root.ok) throw new Error('Pages root failed: HTTP ' + root.status);

          const health = await fetch(origin + '/api/health', {
            headers: { Accept: 'application/json' },
          });
          const healthBody = await health.json().catch(() => null);
          if (!health.ok || healthBody?.ok !== true) {
            throw new Error('Direct Pages API health failed: HTTP ' + health.status);
          }

          const provider = await fetch(origin + '/api/providers/status', {
            headers: { Accept: 'application/json' },
          });
          const providerBody = await provider.json().catch(() => null);
          if (!provider.ok || providerBody?.enabled !== true) {
            throw new Error('Direct Pages provider runtime failed');
          }

          console.log(JSON.stringify({
            canonicalOrigin: origin + '/',
            providerCapabilities: providerBody?.capabilities ?? null,
            directPagesApi: true,
            directPagesD1: true,
            providerRuntimeEnabled: true,
            valuesExposed: false,
          }));
          NODE

      - name: Clean stale Pages preview deployments
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.PAGES_PROJECT;
          const base =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/' + projectName + '/deployments';
          const headers = { Authorization: 'Bearer ' + token };

          const listPreviewPage = async () => {
            const url = new URL(base);
            url.searchParams.set('env', 'preview');
            url.searchParams.set('page', '1');
            url.searchParams.set('per_page', '20');
            const response = await fetch(url, { headers });
            const text = await response.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch {}
            if (!response.ok || body?.success !== true) {
              throw new Error(
                'Failed to list preview deployments: HTTP ' +
                response.status +
                ' body=' +
                text.slice(0, 300),
              );
            }
            return Array.isArray(body.result) ? body.result : [];
          };

          let deleted = 0;
          for (let pass = 0; pass < 100; pass += 1) {
            const previews = await listPreviewPage();
            if (previews.length === 0) break;

            for (const deployment of previews) {
              if (!deployment?.id) continue;
              const url = new URL(base + '/' + deployment.id);
              url.searchParams.set('force', 'true');
              const response = await fetch(url, { method: 'DELETE', headers });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : null; } catch {}
              if (!response.ok || body?.success !== true) {
                throw new Error(
                  'Failed to delete preview deployment: HTTP ' +
                  response.status +
                  ' body=' +
                  text.slice(0, 300),
                );
              }
              deleted += 1;
            }
          }

          const remaining = await listPreviewPage();
          if (remaining.length !== 0) {
            throw new Error('Pages preview deployments remain after cleanup');
          }

          console.log(JSON.stringify({
            deletedPreviewDeployments: deleted,
            remainingPreviewDeployments: 0,
            valuesExposed: false,
          }));
          NODE
