name: One-Time Real Notification E2E Readiness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-real-notification-e2e-readiness.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read production D1 readiness only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute come-back-home-db             --remote             --config wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM people) AS people,
              (SELECT COUNT(*) FROM schedules) AS schedules,
              (SELECT COUNT(*) FROM schedules WHERE enabled = 1 AND schedule_date >= '2026-10-07') AS future_enabled_schedules,
              (SELECT COUNT(*) FROM places WHERE kind = 'origin') AS origin_places,
              (SELECT COUNT(*) FROM places WHERE kind = 'destination') AS destination_places,
              (SELECT COUNT(*) FROM transit_access_points WHERE selected = 1) AS selected_transit_points,
              (SELECT COUNT(*) FROM saved_commute_routes) AS saved_routes,
              (SELECT COUNT(*) FROM saved_commute_routes WHERE active = 1) AS active_saved_routes,
              (SELECT COUNT(*) FROM push_subscriptions WHERE active = 1) AS active_push_subscriptions,
              (SELECT COUNT(*) FROM notification_jobs) AS notification_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status = 'pending') AS pending_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status = 'sent') AS sent_jobs,
              (SELECT COUNT(*) FROM notification_jobs WHERE status = 'failed') AS failed_jobs,
              (SELECT COUNT(*) FROM notification_planner_state) AS planner_states,
              COALESCE((SELECT shift_end_enabled FROM notification_settings WHERE id = 'default'), -1) AS shift_end_enabled,
              COALESCE((SELECT eta_change_enabled FROM notification_settings WHERE id = 'default'), -1) AS eta_change_enabled,
              COALESCE((SELECT left_work_enabled FROM notification_settings WHERE id = 'default'), -1) AS left_work_enabled,
              COALESCE((SELECT home_arrival_enabled FROM notification_settings WHERE id = 'default'), -1) AS home_arrival_enabled;"             --json > /tmp/e2e-readiness.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('/tmp/e2e-readiness.json', 'utf8'));
          const rows = Array.isArray(raw)
            ? raw.flatMap((item) => item?.results ?? item?.result?.results ?? [])
            : raw?.results ?? raw?.result?.results ?? [];
          if (rows.length !== 1) throw new Error('Unexpected readiness result shape');
          const row = rows[0];
          const allowed = [
            'people','schedules','future_enabled_schedules','origin_places','destination_places',
            'selected_transit_points','saved_routes','active_saved_routes','active_push_subscriptions',
            'notification_jobs','pending_jobs','sent_jobs','failed_jobs','planner_states',
            'shift_end_enabled','eta_change_enabled','left_work_enabled','home_arrival_enabled'
          ];
          const sanitized = Object.fromEntries(allowed.map((key) => [key, Number(row[key] ?? 0)]));
          console.log('CBH_REAL_E2E_READINESS=' + JSON.stringify(sanitized));
          NODE
