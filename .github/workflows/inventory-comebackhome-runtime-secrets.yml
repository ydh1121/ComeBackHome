name: Inventory ComeBackHome Runtime Secrets

on:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/inventory-comebackhome-runtime-secrets.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Worker secret names only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare credentials missing');

          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/workers/scripts/come-back-home-runtime/secrets',
            { headers: { Authorization: 'Bearer ' + token } },
          );
          const body = await response.json();
          if (!response.ok || body.success !== true) {
            throw new Error('Failed to list Worker secret names');
          }

          const names = (body.result ?? [])
            .map((item) => item?.name)
            .filter((name) => typeof name === 'string')
            .sort();

          fs.mkdirSync('runtime-evidence', { recursive: true });
          fs.writeFileSync(
            'runtime-evidence/cloudflare-worker-secret-inventory.json',
            JSON.stringify({
              workerName: 'come-back-home-runtime',
              secretNames: names,
              valuesExposed: false,
            }, null, 2) + '\n',
          );
          NODE

      - name: Commit sanitized secret inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/cloudflare-worker-secret-inventory.json
          git diff --cached --quiet || git commit -m "chore: record Worker secret-name inventory"
          git push
