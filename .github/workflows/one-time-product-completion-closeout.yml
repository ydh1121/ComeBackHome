name: One-Time Product Completion Closeout

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-product-completion-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical Pages deployment and bindings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare readback credentials unavailable');

          const headers = { Authorization: 'Bearer ' + token };
          const projectUrl =
            'https://api.cloudflare.com/client/v4/accounts/' + accountId +
            '/pages/projects/come-back-home';

          const projectResponse = await fetch(projectUrl, { headers });
          const projectBody = await projectResponse.json();
          if (!projectResponse.ok || projectBody?.success !== true) {
            throw new Error('Cloudflare Pages project readback failed');
          }
          const project = projectBody.result;
          const production = project?.deployment_configs?.production ?? {};
          const source = project?.source?.config ?? {};

          const deploymentsUrl = new URL(projectUrl + '/deployments');
          deploymentsUrl.searchParams.set('env', 'production');
          deploymentsUrl.searchParams.set('per_page', '20');
          const deploymentsResponse = await fetch(deploymentsUrl, { headers });
          const deploymentsBody = await deploymentsResponse.json();
          if (!deploymentsResponse.ok || deploymentsBody?.success !== true) {
            throw new Error('Cloudflare Pages deployments readback failed');
          }
          const deployments = Array.isArray(deploymentsBody.result) ? deploymentsBody.result : [];
          const latest = deployments[0] ?? null;
          const deployedCommit = latest?.deployment_trigger?.metadata?.commit_hash ?? null;

          console.log(JSON.stringify({
            canonicalProject: project?.name === 'come-back-home',
            canonicalSubdomain: project?.subdomain ?? null,
            productionDeploymentsEnabled: source.production_deployments_enabled === true,
            previewDeploymentSetting: source.preview_deployment_setting ?? null,
            currentProductionCommit: deployedCommit,
            expectedMainCommit: process.env.EXPECTED_MAIN_SHA,
            deploymentMatchesMain: deployedCommit === process.env.EXPECTED_MAIN_SHA,
            d1Bound: Boolean(production.d1_databases?.DB?.id),
            kakaoBound: Boolean(production.env_vars?.KAKAO_REST_API_KEY),
            seoulBusBound: Boolean(production.env_vars?.SEOUL_BUS_SERVICE_KEY),
            seoulSubwayBound: Boolean(production.env_vars?.SEOUL_SUBWAY_API_KEY),
            vapidPrivateBound: Boolean(production.env_vars?.VAPID_PRIVATE_KEY),
            presenceTokenBound: Boolean(production.env_vars?.PRESENCE_EVENT_INGEST_TOKEN),
            obsoleteServiceBindingPresent: Boolean(production.services?.CBH_RUNTIME),
            valuesExposed: false,
          }));

          if (project?.name !== 'come-back-home') throw new Error('Canonical Pages project mismatch');
          if (source.preview_deployment_setting !== 'none') throw new Error('Preview deployments are not disabled');
          if (production.services?.CBH_RUNTIME) throw new Error('Obsolete application service binding remains');
          NODE

      - name: Delete merged completion branches
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const headers = {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const branches = [
            'feat/final-product-completion',
            'feat/schedule-image-import',
          ];
          const results = [];
          for (const branch of branches) {
            const ref = 'heads/' + branch;
            const url = 'https://api.github.com/repos/' + repo + '/git/refs/' + ref;
            const response = await fetch(url, { method: 'DELETE', headers });
            if (![204, 404].includes(response.status)) {
              throw new Error('Failed to delete branch ' + branch + ': HTTP ' + response.status);
            }
            results.push({ branch, deletedOrAbsent: true });
          }
          console.log(JSON.stringify({ branchCleanup: results }));
          NODE
