name: Inventory ComeBackHome D1

on:
  push:
    branches:
      - activation/runtime-phase1
    paths:
      - ".github/workflows/inventory-comebackhome-d1.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read D1 inventory
        run: npx wrangler d1 list --json > /tmp/d1-list.json

      - name: Write sanitized evidence
        run: |
          mkdir -p runtime-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const all = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const row = all.find((item) => item.name === 'come-back-home-db') ?? null;
          const out = {
            databaseName: 'come-back-home-db',
            exists: Boolean(row),
            databaseId: row?.uuid ?? row?.id ?? null,
            createdAt: row?.created_at ?? row?.createdAt ?? null
          };
          fs.writeFileSync('runtime-evidence/cloudflare-d1-inventory.json', JSON.stringify(out, null, 2) + '\n');
          NODE

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/cloudflare-d1-inventory.json
          git diff --cached --quiet || git commit -m "chore: record ComeBackHome D1 inventory"
          git push
