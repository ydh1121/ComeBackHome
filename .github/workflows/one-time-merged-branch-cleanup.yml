name: One-Time Merged Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-merged-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged recovery branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/pages-secret-redeploy-smoke"
            "fix/seoul-bus-stop-coordinate"
            "fix/seoul-bus-xml-runtime"
            "fix/seoul-provider-key-contract"
            "fix/seoul-subway-station-query"
            "fix/transit-resolution-missing-distance"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

      - name: Verify main-only branch set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin |
            awk '{sub("refs/heads/","",$2); print $2}' |
            sort
          )
          printf 'branches=%s\n' "${branches[*]}"
          if [ "${#branches[@]}" -ne 1 ] || [ "${branches[0]}" != "main" ]; then
            echo "Unexpected branches remain" >&2
            exit 1
          fi
