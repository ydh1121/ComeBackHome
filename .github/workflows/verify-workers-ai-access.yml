name: Workers AI read-only account access

# Uses owner-managed Actions secrets without disclosing their values.
# No model inference, licence submission, deployment, D1 or paid API calls.
on:
  workflow_dispatch:
  push:
    branches: [feat/nonimage-weekly-xlsx-import]
    paths: [.github/workflows/verify-workers-ai-access.yml]

permissions: {}

concurrency:
  group: comebackhome-workers-ai-readonly-access
  cancel-in-progress: false

jobs:
  inspect-access:
    if: github.repository == 'ydh1121/ComeBackHome' && github.ref == 'refs/heads/feat/nonimage-weekly-xlsx-import'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Workers AI catalog and account subscription metadata
        env:
          CBH_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CBH_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // Official endpoints:
          // https://developers.cloudflare.com/api/resources/ai/subresources/models/methods/list/
          // https://developers.cloudflare.com/api/resources/accounts/subresources/subscriptions/methods/get/
          const token = process.env.CBH_AI_TOKEN;
          const accountId = process.env.CBH_ACCOUNT_ID;
          const report = {
            mode: 'READ_ONLY', tokenPresent: Boolean(token), accountIdPresent: Boolean(accountId),
            inferenceCalls: 0, accountMutations: 0, productionWrites: 0,
            licenceApiExecuted: false, quotaVerified: false, freeOnlyReady: false,
          };
          async function read(suffix) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + accountId + suffix, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(30_000),
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
            });
            const data = await response.json().catch(() => null);
            return { http: response.status, ok: response.ok && data?.success === true,
              errorCodes: Array.isArray(data?.errors) ? data.errors.map(e => e?.code).filter(Number.isInteger) : [],
              result: data?.result };
          }
          try {
            if (!token || !accountId) {
              report.blocker = 'OWNER_MANAGED_ACTIONS_SECRET_MISSING';
            } else if (!/^[a-f0-9]{32}$/i.test(accountId)) {
              report.blocker = 'ACCOUNT_ID_FORMAT_INVALID';
            } else {
              const model = '@cf/meta/llama-3.2-11b-vision-instruct';
              const catalog = await read('/ai/models/search?search=' + encodeURIComponent(model) + '&per_page=5');
              report.catalog = { http: catalog.http, accessible: catalog.ok, errorCodes: catalog.errorCodes };
              if (!catalog.ok) {
                report.blocker = 'WORKERS_AI_CATALOG_ACCESS_DENIED_OR_UNAVAILABLE';
              } else {
                report.visionModelListed = Array.isArray(catalog.result) && catalog.result.some(m => m?.name === model);
                const subscriptions = await read('/subscriptions');
                report.subscriptions = { http: subscriptions.http, accessible: subscriptions.ok,
                  errorCodes: subscriptions.errorCodes };
                // Do not print billing details or infer a free plan from absent subscriptions.
                report.blocker = subscriptions.ok
                  ? 'ACCOUNT_QUOTA_AND_FREE_ONLY_GUARD_NOT_YET_VERIFIED'
                  : 'SUBSCRIPTION_READ_ACCESS_UNAVAILABLE';
              }
            }
          } catch {
            report.blocker = 'CLOUDFLARE_READ_REQUEST_FAILED';
          }
          console.log('CBH_WORKERS_AI_READONLY_ACCESS=' + JSON.stringify(report));
          // A completed probe is not proof of inference permission, quota or OCR acceptance.
          if (!report.catalog?.accessible) process.exitCode = 1;
          NODE
