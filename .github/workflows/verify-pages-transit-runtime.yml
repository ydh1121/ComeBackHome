name: Verify Pages Transit Runtime — One-Shot Kakao Route Smoke

# Never called by push/PR/merge. Explicitly approved, one-run only, and the
# Node script also refuses execution before 2026-10-09 00:05 KST.
on:
  workflow_dispatch:
    inputs:
      route_smoke:
        description: "Explicitly approve exactly ONE live Kakao public-transit API request"
        required: true
        type: choice
        options:
          - DENIED
          - APPROVED_ONE_RUN
        default: DENIED

permissions:
  contents: read

concurrency:
  group: cbh-kakao-one-shot-route-smoke
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.route_smoke == 'APPROVED_ONE_RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CBH_KAKAO_ROUTE_SMOKE: ${{ inputs.route_smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate guarded script syntax without network access
        run: node --check scripts/verify-kakao-route-one-shot.mjs
      - name: Install isolated Chromium QA dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: One live route request, then cached response UI acceptance
        run: node scripts/verify-kakao-route-one-shot.mjs
