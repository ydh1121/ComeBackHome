name: One-Time Canonical Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-canonical-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete Cloudflare Access app
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare credentials missing');
          const headers = { Authorization: 'Bearer ' + token };
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/access/apps';
          const list = await fetch(base + '?per_page=100', { headers });
          const body = await list.json();
          if (!list.ok || body.success !== true) throw new Error('Failed to list Access apps');
          const targets = (body.result ?? []).filter(
            (app) => app?.domain === 'come-back-home-runtime.ydh1121.workers.dev'
          );
          for (const app of targets) {
            const response = await fetch(base + '/' + app.id, { method: 'DELETE', headers });
            const result = await response.json();
            if (!response.ok || result.success !== true) {
              throw new Error('Failed to delete obsolete ComeBackHome Access app');
            }
          }
          const verify = await fetch(base + '?per_page=100', { headers });
          const verifyBody = await verify.json();
          if (!verify.ok || verifyBody.success !== true) throw new Error('Failed to verify Access cleanup');
          if ((verifyBody.result ?? []).some(
            (app) => app?.domain === 'come-back-home-runtime.ydh1121.workers.dev'
          )) {
            throw new Error('Obsolete ComeBackHome Access app still exists');
          }
          console.log('Obsolete workers.dev Access app removed');
          NODE

      - name: Delete every non-main branch
        shell: bash
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mapfile -t branches < <(
            git ls-remote --heads origin |
              awk '{print $2}' |
              sed 's#refs/heads/##' |
              grep -v '^main$'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting stale branch: $branch"
            git push origin --delete "$branch"
          done
          remaining="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')"
          if [ "$remaining" != "main" ]; then
            echo "Unexpected branches remain:"
            echo "$remaining"
            exit 1
          fi
          echo "Only main remains"
        env:
          GITHUB_TOKEN: ${{ github.token }}
