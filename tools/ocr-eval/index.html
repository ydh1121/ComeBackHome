<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComeBackHome Private OCR Evaluation</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">LOCAL-ONLY / NON-PRODUCTION</p>
        <h1>근무표 OCR 평가</h1>
        <p>
          선택한 이미지는 브라우저 메모리에서만 처리됩니다.
          외부 OCR API 업로드·이미지 저장·production import commit은 수행하지 않습니다.
        </p>
      </header>

      <section class="panel controls">
        <label>
          <span>근무표 이미지 선택</span>
          <input id="schedule-image" type="file" accept="image/png,image/jpeg,image/webp" multiple />
        </label>
        <button id="run" type="button">선택 이미지 전체 OCR 실행</button>
        <button id="copy-all" type="button" class="secondary" disabled>전체 QA 결과 복사</button>
        <button id="save-all" type="button" class="secondary" disabled>결과 JSON 저장</button>
        <button id="clear" type="button" class="secondary">결과 지우기</button>
      </section>

      <section class="panel status-panel">
        <strong id="status">대기 중</strong>
        <p id="selection">선택된 이미지 0개</p>
        <p id="privacy">외부 전송 0 · source image persistence 0 · review-only</p>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>요약</h2>
          <pre id="summary">아직 실행하지 않았습니다.</pre>
        </article>
        <article class="panel">
          <h2>Adaptive parser 결과</h2>
          <pre id="parsed">아직 실행하지 않았습니다.</pre>
        </article>
      </section>

      <section class="panel">
        <h2>OCR tokens</h2>
        <pre id="tokens">아직 실행하지 않았습니다.</pre>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
